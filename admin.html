<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SGCM-Mesas — Organização</title><link rel="stylesheet" href="assets/style.css"><script src="config.js"></script><script src="assets/api.js"></script></head><body>
<header><h1>SGCM-Mesas — Organização</h1><div class="top-links"><a href="recepcao.html">Recepção</a><a href="convidado.html">Convidado</a><a href="reserva.html">Reserva</a><a href="tv.html">TV</a></div></header>
<main>
<div class="panel"><div class="g3"><div><label>Evento</label><select id="eventSelect"></select></div><div><label>&nbsp;</label><button onclick="newEvent()">+ Novo evento</button></div><div><label>Token</label><input id="tokenView" readonly></div></div></div>
<div class="tabs" id="tabs"><button data-tab="dashboard" class="active">Dashboard</button><button data-tab="evento">Evento</button><button data-tab="pessoas">Pessoas</button><button data-tab="convidados">Convidados</button><button data-tab="mesas">Mesas</button><button data-tab="croqui">Croqui</button><button data-tab="cerimonial">Cerimonial</button><button data-tab="nominata">Nominata</button><button data-tab="conteudos">Conteúdos</button></div>
<section id="dashboard" class="tab active"></section>
<section id="evento" class="tab"></section>
<section id="pessoas" class="tab"></section>
<section id="convidados" class="tab"></section>
<section id="mesas" class="tab"></section>
<section id="croqui" class="tab"></section>
<section id="cerimonial" class="tab"></section>
<section id="nominata" class="tab"></section>
<section id="conteudos" class="tab"></section>
</main><div id="modal" class="modal-back"><div class="modal" id="modalBody"></div></div><script>document.body.insertAdjacentHTML('beforeend',foot())</script>
<script>
const token=qs('token');let eventId=qs('evento')||'';let S={events:[],people:[],guests:[],tables:[],seats:[],contents:[],icaModels:[]};
document.getElementById('tokenView').value=token?token.slice(0,8)+'…':'(ausente)';
document.getElementById('tabs').onclick=e=>{if(e.target.dataset.tab){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b===e.target));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.id===e.target.dataset.tab))}};
async function load(){try{S=await apiGet('adminBootstrap',{token,evento:eventId});if(!eventId&&S.events.length)eventId=String(S.events[0].ID_EVENTO);if(eventId){S=await apiGet('adminBootstrap',{token,evento:eventId})}renderAll()}catch(e){toast(e.message,true);document.getElementById('dashboard').innerHTML=`<div class=panel><h2>Não foi possível carregar</h2><p>${esc(e.message)}</p><p class=muted>Abra esta página com ?token=TOKEN_ADMIN e configure a API.</p></div>`}}
function event(){return S.events.find(e=>String(e.ID_EVENTO)===String(eventId))||{}}
function renderAll(){renderEventSelect();renderDashboard();renderEvent();renderPeople();renderGuests();renderTables();renderCroqui();renderCerimonial();renderNominata();renderContents()}
function renderEventSelect(){const s=document.getElementById('eventSelect');s.innerHTML=S.events.map(e=>`<option value="${esc(e.ID_EVENTO)}" ${String(e.ID_EVENTO)===String(eventId)?'selected':''}>${esc(e.NOME)} (${esc(e.ID_EVENTO)})</option>`).join('');s.onchange=()=>{eventId=s.value;history.replaceState(null,'',`?token=${encodeURIComponent(token)}&evento=${encodeURIComponent(eventId)}`);load()}}
function renderDashboard(){const gs=S.guests, confirmed=gs.filter(g=>g.RSVP==='CONFIRMADO').length,present=gs.filter(g=>g.CHECKIN==='PRESENTE').length,auth=gs.filter(g=>g.AUTORIDADE_INTERESSE==='SIM').length,authp=gs.filter(g=>g.AUTORIDADE_INTERESSE==='SIM'&&g.CHECKIN==='PRESENTE').length;document.getElementById('dashboard').innerHTML=`<div class=kpis><div class=kpi><b>${gs.length}</b><span>Convidados</span></div><div class=kpi><b>${confirmed}</b><span>Confirmados</span></div><div class=kpi><b>${present}</b><span>Presentes</span></div><div class=kpi><b>${auth}</b><span>Autoridades de interesse</span></div><div class=kpi><b>${authp}</b><span>Autoridades presentes</span></div></div><div class=panel><h2>${esc(event().NOME||'Selecione um evento')}</h2><p>${esc(event().DATA||'')} · ${esc(event().LOCAL||'')}</p><div class=actions><a href="recepcao.html?token=${encodeURIComponent(token)}&evento=${encodeURIComponent(eventId)}"><button>Recepção</button></a><a href="convidado.html?evento=${encodeURIComponent(eventId)}"><button class=secondary>Portal/QR único</button></a><a href="reserva.html?evento=${encodeURIComponent(eventId)}"><button class=secondary>Reserva de mesa</button></a><a href="tv.html?token=${encodeURIComponent(token)}&evento=${encodeURIComponent(eventId)}"><button class=secondary>TV</button></a></div></div>`}
function renderEvent(){const e=event();document.getElementById('evento').innerHTML=`<div class=panel><h2>Configuração do evento</h2><div class="grid g3"><div><label>ID do evento</label><input id=e_id value="${esc(e.ID_EVENTO||'')}"></div><div><label>Nome</label><input id=e_nome value="${esc(e.NOME||'')}"></div><div><label>Data</label><input id=e_data type=date value="${esc(e.DATA||'')}"></div><div><label>Local</label><input id=e_local value="${esc(e.LOCAL||'')}"></div><div><label>Status</label><select id=e_status>${['RASCUNHO','PUBLICADO','ENCERRADO'].map(x=>`<option ${e.STATUS===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Modo padrão</label><select id=e_modo>${['FIXO','AUTOGESTAO','LIVRE','HIBRIDO'].map(x=>`<option ${e.MODO_PADRAO===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Banner (URL)</label><input id=e_banner value="${esc(e.BANNER_URL||'')}"></div><div><label>Fundo do croqui (URL)</label><input id=e_bg value="${esc(e.CROQUI_FUNDO_URL||'')}"></div><div><label>Exibir nomes na TV</label><select id=e_tv><option ${e.EXIBIR_NOMES_TV==='NAO'?'selected':''}>NAO</option><option ${e.EXIBIR_NOMES_TV==='SIM'?'selected':''}>SIM</option></select></div></div><p><button onclick=saveEvent()>Salvar evento</button></p></div>`}
async function saveEvent(){try{const p={ID_EVENTO:e_id.value.trim(),NOME:e_nome.value.trim(),DATA:e_data.value,LOCAL:e_local.value,STATUS:e_status.value,MODO_PADRAO:e_modo.value,BANNER_URL:e_banner.value.trim(),CROQUI_FUNDO_URL:e_bg.value.trim(),EXIBIR_NOMES_TV:e_tv.value};const r=await apiPost('saveEvent',p,token);eventId=r.id;toast('Evento salvo');load()}catch(e){toast(e.message,true)}}
function newEvent(){eventId='';S.events.unshift({ID_EVENTO:'',NOME:'Novo evento',STATUS:'RASCUNHO'});renderEvent();document.querySelector('[data-tab=evento]').click()}
function renderPeople(){document.getElementById('pessoas').innerHTML=`<div class=panel><div class=actions><h2 style="flex:1">Base de pessoas</h2><button onclick="editPerson()">+ Nova pessoa</button></div><input id=peopleQ placeholder="Buscar nome, posto, organização..." oninput=renderPeopleTable()><div id=peopleTable></div></div>`;renderPeopleTable()}
function renderPeopleTable(){const q=normalizeClient((document.getElementById('peopleQ')||{}).value||'');const arr=S.people.filter(p=>normalizeClient([p.NOME_COMPLETO,p.NOME_GUERRA,p.POSTO,p.CARGO,p.ORGANIZACAO].join(' ')).includes(q)).slice(0,200);document.getElementById('peopleTable').innerHTML=`<div class=table-wrap><table><thead><tr><th>Posto</th><th>Nome</th><th>Cargo/OM</th><th>Precedência</th><th></th></tr></thead><tbody>${arr.map(p=>`<tr><td>${esc(p.POSTO)}</td><td><b>${esc(p.NOME_COMPLETO)}</b><br><span class=muted>${esc(p.NOME_GUERRA)}</span></td><td>${esc(p.CARGO)}<br><span class=muted>${esc(p.ORGANIZACAO)}</span></td><td>${esc(p.PRECEDENCIA)}</td><td><button class=ghost onclick='editPerson(${JSON.stringify(String(p.ID_PESSOA))})'>Editar</button> <button onclick='addPersonToEvent(${JSON.stringify(String(p.ID_PESSOA))})'>Adicionar ao evento</button></td></tr>`).join('')}</tbody></table></div>`}
function normalizeClient(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function editPerson(id){const p=S.people.find(x=>String(x.ID_PESSOA)===String(id))||{};openModal(`<h2>${id?'Editar':'Nova'} pessoa</h2><div class="grid g3"><div><label>Posto</label><input id=p_posto value="${esc(p.POSTO||'')}"></div><div><label>Nome completo</label><input id=p_nome value="${esc(p.NOME_COMPLETO||'')}"></div><div><label>Nome de guerra</label><input id=p_guerra value="${esc(p.NOME_GUERRA||'')}"></div><div><label>Cargo</label><input id=p_cargo value="${esc(p.CARGO||'')}"></div><div><label>Organização</label><input id=p_org value="${esc(p.ORGANIZACAO||'')}"></div><div><label>Sexo</label><select id=p_sexo><option></option><option ${p.SEXO==='M'?'selected':''}>M</option><option ${p.SEXO==='F'?'selected':''}>F</option></select></div><div><label>E-mail</label><input id=p_email value="${esc(p.EMAIL||'')}"></div><div><label>Telefone</label><input id=p_tel value="${esc(p.TELEFONE||'')}"></div><div><label>Foto URL</label><input id=p_foto value="${esc(p.FOTO_URL||'')}"></div><div><label>Vocativo</label><input id=p_voc value="${esc(p.VOCATIVO||'')}"></div><div><label>Precedência (número)</label><input id=p_prec type=number value="${esc(p.PRECEDENCIA||'')}"></div></div><p><button onclick='savePerson(${JSON.stringify(String(id||''))})'>Salvar</button> <button class=secondary onclick=closeModal()>Cancelar</button></p>`)}
async function savePerson(id){try{const p={ID_PESSOA:id,NOME_COMPLETO:p_nome.value.trim(),NOME_GUERRA:p_guerra.value.trim(),POSTO:p_posto.value.trim(),CARGO:p_cargo.value.trim(),ORGANIZACAO:p_org.value.trim(),SEXO:p_sexo.value,EMAIL:p_email.value.trim(),TELEFONE:p_tel.value.trim(),FOTO_URL:p_foto.value.trim(),VOCATIVO:p_voc.value.trim(),PRECEDENCIA:p_prec.value};await apiPost('savePerson',p,token);closeModal();toast('Pessoa salva');load()}catch(e){toast(e.message,true)}}
async function addPersonToEvent(id){try{await apiPost('addGuest',{ID_EVENTO:eventId,ID_PESSOA:id},token);toast('Adicionado ao evento');load()}catch(e){toast(e.message,true)}}
function renderGuests(){const rows=S.guests.map(g=>`<tr><td>${esc(g.ORDEM_EVENTO)}</td><td>${esc(g.pessoa.POSTO)} <b>${esc(g.pessoa.NOME_COMPLETO)}</b></td><td>${tableBadge(g.RSVP)}</td><td>${tableBadge(g.CHECKIN)}</td><td>${esc(tableName(g.MESA_ID))}</td><td>${g.AUTORIDADE_INTERESSE==='SIM'?'<span class="badge b-blue">AUTORIDADE</span>':''}</td><td><button class=ghost onclick='editGuest(${JSON.stringify(String(g.ID_CONVIDADO))})'>Editar</button><button class=danger onclick='delGuest(${JSON.stringify(String(g.ID_CONVIDADO))})'>Excluir</button></td></tr>`).join('');document.getElementById('convidados').innerHTML=`<div class=panel><div class=actions><h2 style="flex:1">Convidados do evento</h2><span class=muted>${S.guests.length} registros</span></div><div class=table-wrap><table><thead><tr><th>Ordem</th><th>Convidado</th><th>RSVP</th><th>Chegada</th><th>Mesa</th><th>Interesse</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`}
function tableName(id){const t=S.tables.find(x=>String(x.ID_MESA)===String(id));return t?`Mesa ${t.NUMERO} — ${t.NOME||''}`:'—'}
function editGuest(id){const g=S.guests.find(x=>String(x.ID_CONVIDADO)===String(id));if(!g)return;openModal(`<h2>${esc(g.pessoa.NOME_COMPLETO)}</h2><div class="grid g3"><div><label>Ordem no evento</label><input id=g_ord type=number value="${esc(g.ORDEM_EVENTO||'')}"></div><div><label>Mesa</label><select id=g_mesa><option value="">Sem mesa</option>${S.tables.map(t=>`<option value="${esc(t.ID_MESA)}" ${String(t.ID_MESA)===String(g.MESA_ID)?'selected':''}>Mesa ${esc(t.NUMERO)} — ${esc(t.NOME)}</option>`).join('')}</select></div><div><label>RSVP</label><select id=g_rsvp>${['PENDENTE','CONFIRMADO','NAO_COMPARECERA'].map(x=>`<option ${g.RSVP===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Autoridade de interesse</label><select id=g_auth><option ${g.AUTORIDADE_INTERESSE!=='SIM'?'selected':''}>NAO</option><option ${g.AUTORIDADE_INTERESSE==='SIM'?'selected':''}>SIM</option></select></div><div><label>Nível</label><select id=g_nivel>${['CONVIDADO','AUTORIDADE','ESPECIAL'].map(x=>`<option ${g.NIVEL_INTERESSE===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Acompanhado</label><select id=g_acomp><option ${g.ACOMPANHADO!=='SIM'?'selected':''}>NAO</option><option ${g.ACOMPANHADO==='SIM'?'selected':''}>SIM</option></select></div><div><label>ID do acompanhante</label><select id=g_acompid><option value="">—</option>${S.guests.filter(x=>x.ID_CONVIDADO!==g.ID_CONVIDADO).map(x=>`<option value="${esc(x.ID_CONVIDADO)}" ${String(x.ID_CONVIDADO)===String(g.ID_ACOMPANHANTE)?'selected':''}>${esc(x.pessoa.NOME_COMPLETO)}</option>`).join('')}</select></div><div style="grid-column:1/-1"><label>Observação da recepção</label><textarea id=g_obs>${esc(g.OBS_RECEPCAO||'')}</textarea></div></div><p><button onclick='saveGuest(${JSON.stringify(id)})'>Salvar</button> <button class=secondary onclick=closeModal()>Cancelar</button></p>`)}
async function saveGuest(id){try{await apiPost('saveGuest',{ID_CONVIDADO:id,ORDEM_EVENTO:g_ord.value,MESA_ID:g_mesa.value,RSVP:g_rsvp.value,AUTORIDADE_INTERESSE:g_auth.value,NIVEL_INTERESSE:g_nivel.value,ACOMPANHADO:g_acomp.value,ID_ACOMPANHANTE:g_acompid.value,OBS_RECEPCAO:g_obs.value},token);closeModal();toast('Convidado atualizado');load()}catch(e){toast(e.message,true)}}
async function delGuest(id){if(!confirm('Excluir convidado do evento?'))return;try{await apiPost('deleteGuest',{ID_CONVIDADO:id},token);load()}catch(e){toast(e.message,true)}}
function renderTables(){document.getElementById('mesas').innerHTML=`<div class=panel><div class=actions><h2 style="flex:1">Mesas</h2><button onclick=editTable()>+ Nova mesa</button></div><div class=table-wrap><table><thead><tr><th>Nº</th><th>Nome</th><th>Tipo</th><th>Política</th><th>Formato</th><th>Capacidade</th><th>ICA</th><th></th></tr></thead><tbody>${S.tables.map(t=>`<tr><td><b>${esc(t.NUMERO)}</b></td><td>${esc(t.NOME)}</td><td>${esc(t.TIPO)}</td><td>${esc(t.POLITICA)}</td><td>${esc(t.FORMATO)}</td><td>${esc(t.CAPACIDADE)}</td><td>${esc(t.ICA_MODELO||'—')}</td><td><button class=ghost onclick='editTable(${JSON.stringify(String(t.ID_MESA))})'>Editar</button><button class=danger onclick='delTable(${JSON.stringify(String(t.ID_MESA))})'>Excluir</button></td></tr>`).join('')}</tbody></table></div></div>`}
function editTable(id){const t=S.tables.find(x=>String(x.ID_MESA)===String(id))||{};openModal(`<h2>${id?'Editar':'Nova'} mesa</h2><div class="grid g4"><div><label>Número</label><input id=t_num value="${esc(t.NUMERO||'')}"></div><div><label>Nome</label><input id=t_nome value="${esc(t.NOME||'')}"></div><div><label>Tipo</label><select id=t_tipo>${['FORMAL','RESERVADA','LIVRE'].map(x=>`<option ${t.TIPO===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Política</label><select id=t_pol>${['FIXO','AUTOGESTAO','LIVRE'].map(x=>`<option ${t.POLITICA===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Formato</label><select id=t_form>${['REDONDA','RETANGULAR','U'].map(x=>`<option ${t.FORMATO===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Capacidade</label><input id=t_cap type=number value="${esc(t.CAPACIDADE||10)}"></div><div><label>X (%)</label><input id=t_x type=number value="${esc(t.X||10)}"></div><div><label>Y (%)</label><input id=t_y type=number value="${esc(t.Y||10)}"></div><div><label>Largura (%)</label><input id=t_w type=number value="${esc(t.W||8)}"></div><div><label>Altura (%)</label><input id=t_h type=number value="${esc(t.H||8)}"></div><div><label>Rotação</label><input id=t_rot type=number value="${esc(t.ROTACAO||0)}"></div><div><label>Destaque/Mesa 1</label><select id=t_dest><option ${t.DESTAQUE!=='SIM'?'selected':''}>NAO</option><option ${t.DESTAQUE==='SIM'?'selected':''}>SIM</option></select></div></div><p><button onclick='saveTable(${JSON.stringify(String(id||''))})'>Salvar</button> <button class=secondary onclick=closeModal()>Cancelar</button></p>`)}
async function saveTable(id){try{await apiPost('saveTable',{ID_MESA:id,ID_EVENTO:eventId,NUMERO:t_num.value,NOME:t_nome.value,TIPO:t_tipo.value,POLITICA:t_pol.value,FORMATO:t_form.value,CAPACIDADE:t_cap.value,X:t_x.value,Y:t_y.value,W:t_w.value,H:t_h.value,ROTACAO:t_rot.value,DESTAQUE:t_dest.value},token);closeModal();toast('Mesa salva');load()}catch(e){toast(e.message,true)}}
async function delTable(id){if(!confirm('Excluir mesa?'))return;await apiPost('deleteTable',{ID_MESA:id},token);load()}
function renderCroqui(){document.getElementById('croqui').innerHTML=`<div class=panel><div class=actions><h2 style="flex:1">Croqui do salão</h2><span class=muted>Clique numa mesa para editar posição e dimensões.</span></div><div id=adminFloor class=floor></div></div>`;renderFloor(document.getElementById('adminFloor'),S.tables.map(t=>({id:t.ID_MESA,numero:t.NUMERO,nome:t.NOME,x:t.X,y:t.Y,w:t.W,h:t.H,rotacao:t.ROTACAO,formato:t.FORMATO,destaque:t.DESTAQUE})),{background:event().CROQUI_FUNDO_URL,draggable:true,click:t=>editTable(t.id),onMove:async(t,x,y)=>{try{await apiPost('saveTable',{ID_MESA:t.id,X:x,Y:y},token);toast(`Mesa ${t.numero} reposicionada`)}catch(e){toast(e.message,true)}}})}
function renderCerimonial(){const formal=S.tables.filter(t=>t.TIPO==='FORMAL');document.getElementById('cerimonial').innerHTML=`<div class=panel><h2>Composição cerimonial — ICA 908-1</h2><p class=muted>Selecione uma mesa formal. A versão 1.0 só automatiza cenários que coincidam com os modelos do extrato fornecido; os demais permanecem para ajuste manual.</p><div class="grid g3"><div><label>Mesa</label><select id=c_table onchange=renderCerimonialDetail()><option value="">Selecione</option>${formal.map(t=>`<option value="${esc(t.ID_MESA)}">Mesa ${esc(t.NUMERO)} — ${esc(t.NOME)}</option>`).join('')}</select></div></div><div id=c_detail></div></div>`}
function renderCerimonialDetail(){const id=c_table.value,t=S.tables.find(x=>String(x.ID_MESA)===String(id));if(!t){c_detail.innerHTML='';return}const guests=S.guests.filter(g=>String(g.MESA_ID)===String(id));const seats=S.seats.filter(s=>String(s.ID_MESA)===String(id));c_detail.innerHTML=`<div class=panel><div class="grid g3"><div><label>Anfitrião</label><select id=c_host><option value="">—</option>${guests.map(g=>`<option value="${esc(g.ID_CONVIDADO)}" ${String(g.ID_CONVIDADO)===String(t.ANFITRIAO_CONVIDADO_ID)?'selected':''}>${esc(g.pessoa.POSTO)} ${esc(g.pessoa.NOME_COMPLETO)}</option>`).join('')}</select></div><div><label>Homenageado</label><select id=c_hon><option value="">—</option>${guests.map(g=>`<option value="${esc(g.ID_CONVIDADO)}" ${String(g.ID_CONVIDADO)===String(t.HOMENAGEADO_CONVIDADO_ID)?'selected':''}>${esc(g.pessoa.POSTO)} ${esc(g.pessoa.NOME_COMPLETO)}</option>`).join('')}</select></div><div><label>Anfitrião é maior precedência?</label><select id=c_high><option ${t.ANFITRIAO_MAIOR_PRECEDENCIA==='SIM'?'selected':''}>SIM</option><option ${t.ANFITRIAO_MAIOR_PRECEDENCIA==='NAO'?'selected':''}>NAO</option></select></div></div><p><button onclick=saveCerimonialConfig()>Salvar configuração</button></p><div class="grid g2"><div><label>Modelo ICA</label><select id=c_model>${S.icaModels.map(m=>`<option value="${m.id}" ${t.ICA_MODELO===m.id?'selected':''}>${m.id} — ${m.shape}, ${m.kind}, ${m.capacity} lugares</option>`).join('')}</select></div><div><label>&nbsp;</label><button class=success onclick=composeICA()>Compor pela ICA</button></div></div></div><div id=seatMap class=seat-map><div class="table-shape ${t.FORMATO==='REDONDA'?'round':''}"></div></div>`;renderSeats(seats)}
function renderSeats(seats){const map=document.getElementById('seatMap');if(!map)return;seats.forEach(s=>{const g=S.guests.find(x=>String(x.ID_CONVIDADO)===String(s.CONVIDADO_ID));const d=document.createElement('div');d.className='seat';d.style.left=`${s.X_REL}%`;d.style.top=`${s.Y_REL}%`;d.innerHTML=`<strong>${esc(s.ROTULO)}</strong>${g?`${esc(g.pessoa.POSTO)} ${esc(g.pessoa.NOME_COMPLETO)}`:'—'}`;d.onclick=()=>editSeat(s.ID_ASSENTO);map.appendChild(d)})}
async function saveCerimonialConfig(){try{await apiPost('saveTable',{ID_MESA:c_table.value,ANFITRIAO_CONVIDADO_ID:c_host.value,HOMENAGEADO_CONVIDADO_ID:c_hon.value,ANFITRIAO_MAIOR_PRECEDENCIA:c_high.value},token);toast('Configuração salva');load()}catch(e){toast(e.message,true)}}
async function composeICA(){try{await saveCerimonialConfig();const r=await apiPost('composeIca',{tableId:c_table.value,modelId:c_model.value},token);if(r.status!=='OK')toast(r.reason,true);else toast('Composição ICA gerada');await load();document.querySelector('[data-tab=cerimonial]').click();setTimeout(()=>{c_table.value=r.status==='OK'?c_table.value:''},0)}catch(e){toast(e.message,true)}}
function editSeat(id){const s=S.seats.find(x=>String(x.ID_ASSENTO)===String(id));if(!s)return;const gs=S.guests.filter(g=>String(g.MESA_ID)===String(s.ID_MESA));openModal(`<h2>Ajuste manual do assento</h2><p class=muted>Ao salvar, este assento será marcado como ajuste manual.</p><div><label>Convidado</label><select id=s_guest><option value="">—</option>${gs.map(g=>`<option value="${esc(g.ID_CONVIDADO)}" ${String(g.ID_CONVIDADO)===String(s.CONVIDADO_ID)?'selected':''}>${esc(g.pessoa.POSTO)} ${esc(g.pessoa.NOME_COMPLETO)}</option>`).join('')}</select></div><p><button onclick='saveSeat(${JSON.stringify(id)})'>Salvar</button> <button class=secondary onclick=closeModal()>Cancelar</button></p>`)}
async function saveSeat(id){await apiPost('saveSeat',{ID_ASSENTO:id,CONVIDADO_ID:s_guest.value},token);closeModal();load()}
function renderNominata(){const arr=S.guests.filter(g=>g.AUTORIDADE_INTERESSE==='SIM').sort((a,b)=>Number(a.ORDEM_EVENTO||a.pessoa.PRECEDENCIA||99999)-Number(b.ORDEM_EVENTO||b.pessoa.PRECEDENCIA||99999));document.getElementById('nominata').innerHTML=`<div class=panel><h2>Nominata operacional</h2><div class=table-wrap><table><thead><tr><th>Ordem</th><th>Autoridade</th><th>Cargo</th><th>Mesa</th><th>RSVP</th><th>Chegada</th></tr></thead><tbody>${arr.map(g=>`<tr><td>${esc(g.ORDEM_EVENTO||g.pessoa.PRECEDENCIA)}</td><td><b>${esc(g.pessoa.POSTO)} ${esc(g.pessoa.NOME_COMPLETO)}</b></td><td>${esc(g.pessoa.CARGO)}</td><td>${esc(tableName(g.MESA_ID))}</td><td>${tableBadge(g.RSVP)}</td><td>${tableBadge(g.CHECKIN)}</td></tr>`).join('')}</tbody></table></div></div>`}
function renderContents(){document.getElementById('conteudos').innerHTML=`<div class=panel><div class=actions><h2 style="flex:1">Conteúdos do portal</h2><button onclick=editContent()>+ Conteúdo</button></div><div class=table-wrap><table><thead><tr><th>Tipo</th><th>Título</th><th>URL</th><th>Ordem</th><th></th></tr></thead><tbody>${S.contents.map(c=>`<tr><td>${esc(c.TIPO)}</td><td>${esc(c.TITULO)}</td><td><a href="${esc(c.URL)}" target=_blank>${esc(c.URL)}</a></td><td>${esc(c.ORDEM)}</td><td><button class=ghost onclick='editContent(${JSON.stringify(String(c.ID_CONTEUDO))})'>Editar</button><button class=danger onclick='delContent(${JSON.stringify(String(c.ID_CONTEUDO))})'>Excluir</button></td></tr>`).join('')}</tbody></table></div></div>`}
function editContent(id){const c=S.contents.find(x=>String(x.ID_CONTEUDO)===String(id))||{};openModal(`<h2>Conteúdo</h2><div class="grid g2"><div><label>Tipo</label><select id=x_tipo>${['ARQUIVO','CARDAPIO','PROGRAMA','HOMENAGEM','PATROCINADOR'].map(x=>`<option ${c.TIPO===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Título</label><input id=x_titulo value="${esc(c.TITULO||'')}"></div><div style="grid-column:1/-1"><label>URL</label><input id=x_url value="${esc(c.URL||'')}"></div><div><label>Ordem</label><input id=x_ord type=number value="${esc(c.ORDEM||0)}"></div><div><label>Ativo</label><select id=x_ativo><option ${c.ATIVO!=='NAO'?'selected':''}>SIM</option><option ${c.ATIVO==='NAO'?'selected':''}>NAO</option></select></div></div><p><button onclick='saveContent(${JSON.stringify(String(id||''))})'>Salvar</button> <button class=secondary onclick=closeModal()>Cancelar</button></p>`)}
async function saveContent(id){await apiPost('saveContent',{ID_CONTEUDO:id,ID_EVENTO:eventId,TIPO:x_tipo.value,TITULO:x_titulo.value,URL:x_url.value,ORDEM:x_ord.value,ATIVO:x_ativo.value},token);closeModal();load()}
async function delContent(id){await apiPost('deleteContent',{ID_CONTEUDO:id},token);load()}
function openModal(html){modalBody.innerHTML=html;modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}modal.onclick=e=>{if(e.target===modal)closeModal()}
load();
</script></body></html>
