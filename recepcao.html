<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SGCM-Mesas — Recepção</title><link rel="stylesheet" href="assets/style.css"><script src="config.js"></script><script src="assets/api.js"></script></head><body>
<header><h1>Recepção de Autoridades e Convidados</h1><div class="top-links"><a href="admin.html">Organização</a><a href="convidado.html">Convidado</a></div></header>
<main><div id="head"></div><div class="tabs"><button class="active" onclick="tab('busca',this)">Busca</button><button onclick="tab('nominata',this)">Nominata</button><button onclick="tab('mapa',this)">Croqui / Vagas</button></div>
<section id="busca" class="tab active"><div class="panel search-box"><h2>Localizar convidado</h2><input id="q" autocomplete="off" placeholder="Digite nome, nome de guerra, posto, cargo ou OM..." oninput="searchSoon()"><div id="results" class="search-results"></div></div></section>
<section id="nominata" class="tab"></section><section id="mapa" class="tab"></section></main><div id="modal" class="modal-back"><div class="modal" id="modalBody"></div></div><script>document.body.insertAdjacentHTML('beforeend',foot())</script>
<script>
const token=qs('token'),eventId=qs('evento');let S=null,timer=null;
function tab(id,b){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
async function load(){try{S=await apiGet('receptionBootstrap',{token,evento:eventId});renderHead();renderNominata();renderMap()}catch(e){toast(e.message,true);head.innerHTML=`<div class=panel><h2>Erro de acesso</h2><p>${esc(e.message)}</p></div>`}}
function renderHead(){const s=S.stats;head.innerHTML=`<div class=panel><h2>${esc(S.event.nome)}</h2><div class=kpis><div class=kpi><b>${s.total}</b><span>Convidados</span></div><div class=kpi><b>${s.confirmados}</b><span>Confirmados</span></div><div class=kpi><b>${s.presentes}</b><span>Presentes</span></div><div class=kpi><b>${s.autoridades}</b><span>Autoridades</span></div><div class=kpi><b>${s.autoridadesPresentes}</b><span>Autoridades presentes</span></div></div></div>`}
function searchSoon(){clearTimeout(timer);timer=setTimeout(search,220)}
async function search(){const v=q.value.trim();if(!v){results.innerHTML='';return}try{const arr=await apiGet('receptionSearch',{token,evento:eventId,q:v});results.innerHTML=arr.length?arr.map(r=>`<div class=result-card onclick='showGuest(${JSON.stringify(JSON.stringify(r))})'>${r.foto?`<img class=avatar src="${esc(r.foto)}" onerror="this.style.visibility='hidden'">`:'<div class=avatar></div>'}<div class=result-main><b>${esc(r.posto)} ${esc(r.nome)}</b><span>${esc(r.cargo)}${r.organizacao?' — '+esc(r.organizacao):''}</span><br>${tableBadge(r.checkin)}</div><div>${r.mesaId?'<span class="badge b-blue">COM MESA</span>':''}</div></div>`).join(''):'<p class=muted>Nenhum resultado.</p>'}catch(e){toast(e.message,true)}}
function showGuest(s){const r=JSON.parse(s);const t=S.tables.find(x=>String(x.id)===String(r.mesaId));modalBody.innerHTML=`<div class=guest-hero>${r.foto?`<img class=avatar style="width:110px;height:110px" src="${esc(r.foto)}">`:''}<h2>${esc(r.posto)} ${esc(r.nome)}</h2><p>${esc(r.cargo)}<br>${esc(r.organizacao)}</p><div class=mesa>${t?'MESA '+esc(t.numero):'SEM MESA'}</div><p>${tableBadge(r.rsvp)} ${tableBadge(r.checkin)}</p><div class=actions style="justify-content:center"><button class=success onclick='doCheckin(${JSON.stringify(r.id)})'>Confirmar chegada</button>${t?`<button onclick='showTable(${JSON.stringify(String(t.id))})'>Ver no croqui</button>`:''}<button class=secondary onclick=closeModal()>Fechar</button></div></div>`;modal.classList.add('show')}
async function doCheckin(id){try{await apiPost('checkin',{ID_CONVIDADO:id,CHECKIN:'PRESENTE'},token);toast('Chegada confirmada');closeModal();await load();if(q.value)search()}catch(e){toast(e.message,true)}}
function renderNominata(){nominata.innerHTML=`<div class=panel><h2>Nominata — autoridades de interesse</h2><div class=table-wrap><table><thead><tr><th>Ordem</th><th>Autoridade</th><th>Cargo</th><th>Mesa</th><th>RSVP</th><th>Chegada</th></tr></thead><tbody>${S.nominata.map(n=>{const t=S.tables.find(x=>String(x.id)===String(n.mesaId));return `<tr><td>${esc(n.ordem)}</td><td><b>${esc(n.posto)} ${esc(n.nome)}</b></td><td>${esc(n.cargo)}</td><td>${t?'Mesa '+esc(t.numero):'—'}</td><td>${tableBadge(n.rsvp)}</td><td>${tableBadge(n.checkin)} ${n.hora?'<span class=muted>'+esc(String(n.hora).slice(11,16))+'</span>':''}</td></tr>`}).join('')}</tbody></table></div></div>`}
function renderMap(){mapa.innerHTML=`<div class=panel><h2>Croqui e ocupação</h2><p class=muted>Verde: há vagas. Vermelho: lotada.</p><div id=floor class=floor></div></div>`;renderFloor(floor,S.tables,{background:S.event.croquiFundo,showVacancies:true,click:t=>toast(`Mesa ${t.numero}: ${t.vagas} vaga(s)`)})}
function showTable(id){closeModal();document.querySelectorAll('.tabs button')[2].click();setTimeout(()=>{renderFloor(floor,S.tables,{background:S.event.croquiFundo,showVacancies:true,highlight:id})},50)}
function closeModal(){modal.classList.remove('show')}modal.onclick=e=>{if(e.target===modal)closeModal()};load();setInterval(load,15000)
</script></body></html>
