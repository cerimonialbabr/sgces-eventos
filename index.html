<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SGCES — Organização</title>
  <style>
:root{
  --bg:#f5f7fb;
  --panel:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --line:#dbe1ea;
  --primary:#173f74;
  --primary-2:#275c9f;
  --soft:#eaf1fb;
  --success:#0f766e;
  --warning:#a16207;
  --danger:#b42318;
  --shadow:0 8px 24px rgba(15,23,42,.08);
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--primary-2);text-decoration:none}
img{max-width:100%;display:block}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.nowrap{white-space:nowrap}
.text-right{text-align:right}

/* shell organização */
.app-shell{min-height:100vh;display:grid;grid-template-columns:260px 1fr}
.sidebar{background:#102d52;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:6px 10px 22px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:16px}
.brand h1{font-size:2.05rem;line-height:1.05;margin:0 0 7px;font-weight:800;letter-spacing:.02em}
.brand p{margin:0;color:#cdd9e8;font-size:.82rem;line-height:1.35}
.nav{display:grid;gap:5px}
.nav button{width:100%;border:0;border-radius:10px;background:transparent;color:#d9e6f4;text-align:left;padding:11px 12px;font-weight:600}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.12);color:#fff}
.sidebar-footer{font-size:.75rem;color:#9fb5cf;margin:28px 10px 0}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.topbar-left,.topbar-right{display:flex;align-items:center;gap:10px;min-width:0}
.active-event-label{font-size:.85rem;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;white-space:nowrap}.active-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#16a34a;margin-right:6px;vertical-align:1px}
.content{padding:26px;max-width:1500px;margin:0 auto}
.page-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.page-heading h2{font-size:2.3rem;line-height:1.15;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
.page-heading p{margin:0;color:var(--muted)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{margin:0 0 12px;font-size:1.12rem}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stats{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 4px 14px rgba(15,23,42,.05)}
.stat strong{display:block;font-size:1.6rem;margin-top:3px}
.stat span{font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}

.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:normal;text-align:center;line-height:1.15;min-height:38px}
.btn:hover{filter:brightness(.98)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-soft{background:var(--soft);border-color:#cbdaf0;color:var(--primary)}
.btn-danger{background:#fff3f2;border-color:#f0c5c1;color:var(--danger)}
.btn-success{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
.btn-sm{padding:6px 9px;font-size:.84rem;border-radius:8px}
.btn-lg{padding:12px 16px;font-size:1rem}
.icon-btn{width:38px;height:38px;padding:0;border-radius:10px}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:.8rem;font-weight:800;color:#445064;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea,.search-input{width:100%;border:1px solid #cfd7e3;border-radius:10px;padding:10px 11px;background:#fff;color:var(--text);outline:none}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.search-input:focus{border-color:#759aca;box-shadow:0 0 0 3px rgba(39,92,159,.11)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.section-actions{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}

.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:10px 11px;border-bottom:1px solid #e8edf4;text-align:left;vertical-align:middle}
th{background:#f8fafc;color:#4b5563;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:0}
tr:hover td{background:#fbfdff}
.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:.75rem;font-weight:800;background:#edf2f7;color:#475569}
.badge.success{background:#dcfce7;color:#166534}
.badge.warning{background:#fef3c7;color:#92400e}
.badge.danger{background:#fee2e2;color:#991b1b}
.badge.info{background:#dbeafe;color:#1d4ed8}

.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:#fff;width:min(840px,96vw);max-height:92vh;overflow:auto;border-radius:18px;box-shadow:0 25px 60px rgba(15,23,42,.25)}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:1.35rem}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:500;display:grid;gap:9px;max-width:380px}
.toast{background:#111827;color:#fff;padding:12px 14px;border-radius:12px;box-shadow:var(--shadow);font-weight:650}
.toast.error{background:#8d1f18}
.toast.success{background:#065f46}
.loading{opacity:.55;pointer-events:none}
.spinner{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* croqui */
.floor-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.floor-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;overflow:auto}
.floor{position:relative;min-width:760px;aspect-ratio:16/9;background-color:#f8fafc;background-image:linear-gradient(90deg,#eef2f7 1px,transparent 1px),linear-gradient(#eef2f7 1px,transparent 1px);background-size:25px 25px;background-position:center;background-repeat:repeat;border:1px dashed #cbd5e1;border-radius:12px;overflow:hidden}
.floor-table{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;text-align:center;background:#eef4fb;border:2px solid #7d9fc8;color:#183b68;font-weight:800;user-select:none;touch-action:none;box-shadow:0 5px 14px rgba(15,23,42,.08);cursor:grab}
.floor-table.round{border-radius:50%}
.floor-table.rect{border-radius:9px}
.floor-table.u{border-radius:10px;border-top-color:transparent;background:transparent;box-shadow:none}
.floor-table.dragging{cursor:grabbing;z-index:10;box-shadow:0 12px 28px rgba(15,23,42,.18)}
.floor-table .occ{display:block;font-size:.72rem;font-weight:700;margin-top:2px;color:#52708f}
.floor-table.highlight{outline:5px solid rgba(22,163,74,.25);background:#dcfce7 !important;border-color:#16a34a !important;color:#14532d !important}
.floor-table.full{background:#fff1f2;border-color:#e11d48;color:#881337}
.floor-table .resize-handle{position:absolute;right:-7px;bottom:-7px;width:17px;height:17px;border-radius:50%;background:#173f74;border:2px solid #fff;box-shadow:0 2px 5px rgba(15,23,42,.25);cursor:nwse-resize;z-index:4}
.floor-table.round .resize-handle{right:2px;bottom:2px}

/* composição da mesa */
.seating-stage{position:relative;min-height:520px;background:#fbfdff;border:1px solid var(--line);border-radius:16px;overflow:auto}
.seating-canvas{position:relative;width:900px;height:500px;margin:0 auto}
.table-shape{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#f1f5f9;border:3px solid #64748b}
.table-shape.round{width:230px;height:230px;border-radius:50%}
.table-shape.rect{width:470px;height:150px;border-radius:8px}
.table-shape.u{width:410px;height:250px;border:20px solid #64748b;border-top:0;background:transparent;border-radius:0 0 12px 12px}
.seat{position:absolute;transform:translate(-50%,-50%);width:46px;height:132px;border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:0;text-align:center;font-size:.74rem;box-shadow:0 3px 9px rgba(15,23,42,.06);display:flex;align-items:center;justify-content:center;overflow:visible}
.seat .seat-vertical{white-space:nowrap;transform:rotate(-90deg);transform-origin:center;font-weight:800;font-size:.74rem;line-height:1}
.photo-upload-box{display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:center;border:1px dashed #cbd5e1;border-radius:12px;padding:10px}
.photo-preview{width:86px;height:86px;border-radius:12px;background:#eef2f7;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#7c899b;font-size:.72rem;font-weight:800;text-align:center}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.nominata-editor{display:block}
.nom-item{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff}
.nom-item .section-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:14px;align-items:center;margin-bottom:0}
.nom-item .actions{width:100%;justify-content:flex-end}
.upload-frame{display:block;width:100%;height:76px;border:0;background:transparent;overflow:hidden}
.photo-upload-box>div:last-child{min-width:0;flex:1}
.nom-item.message{background:#f8fafc;border-style:dashed}
@media(max-width:900px){.nominata-editor{grid-template-columns:1fr}}

/* recepção */
.public-shell{min-height:100vh;background:var(--bg)}
.public-header{background:#102d52;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.public-header h1{font-size:1.85rem;margin:0;line-height:1.05}
.public-header p{margin:4px 0 0;color:#cdd9e8;font-size:.83rem}
.public-main{max-width:1180px;margin:0 auto;padding:22px}
.reception-search{font-size:1.05rem;padding:13px 14px}
.person-card{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px}
.avatar{width:84px;height:84px;border-radius:12px;background:#e9eef5;object-fit:cover;display:flex;align-items:center;justify-content:center;color:#7c899b;font-weight:800;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.person-card h3{margin:0 0 4px;font-size:1.05rem}
.person-card p{margin:2px 0;color:var(--muted);font-size:.88rem}
.nominata-list{display:grid;gap:8px}
.nominata-item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}

/* convidado */
.guest-page{min-height:100vh;background:#f7f8fb}
.guest-hero{background:#102d52;color:#fff;min-height:210px;display:flex;align-items:flex-end;background-size:cover;background-position:center;position:relative}
.guest-hero:before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(3,18,38,.85),rgba(3,18,38,.15))}
.guest-hero-inner{position:relative;z-index:1;max-width:980px;width:100%;margin:0 auto;padding:30px 22px}
.guest-hero h1{font-size:2.15rem;margin:0 0 8px;line-height:1.05}
.guest-main{max-width:980px;margin:0 auto;padding:22px}
.guest-table-callout{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center;box-shadow:var(--shadow)}
.guest-table-callout .number{font-size:3rem;font-weight:900;color:var(--primary);line-height:1}
.content-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.content-link{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;font-weight:750}
.sponsor-row{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;padding:14px}
.sponsor-row a,.sponsor-row span{display:block}
.sponsor-row img{max-width:130px;max-height:70px;object-fit:contain}

/* TV */
.tv-page{min-height:100vh;background:#eef2f7;padding:18px;display:grid;grid-template-rows:auto 1fr auto;gap:14px}
.tv-header{background:#102d52;color:#fff;border-radius:18px;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:18px}
.tv-header h1{font-size:2.15rem;margin:0;line-height:1.05}
.tv-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:14px;min-height:0}
.tv-panel{background:#fff;border-radius:18px;border:1px solid var(--line);padding:16px;overflow:hidden}
.tv-floor{position:relative;width:100%;height:100%;min-height:520px;background:#fbfdff;border-radius:12px;border:1px solid #e2e8f0}
.tv-arrivals{display:grid;gap:8px}
.tv-arrival{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #edf0f4;padding:8px 0;font-size:1.02rem}
.tv-sponsors{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;min-height:86px;display:flex;justify-content:center;align-items:center}

@media (max-width:1100px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .grid-4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  .app-shell{grid-template-columns:1fr}
  .sidebar{position:relative;height:auto;padding:14px}
  .nav{grid-template-columns:repeat(4,minmax(0,1fr));overflow:auto}
  .nav button{text-align:center;font-size:.8rem;padding:9px 7px}
  .brand{padding:3px 5px 14px}.brand h1{font-size:1.65rem}
  .topbar{position:relative;padding:10px 14px;align-items:flex-start;flex-direction:column}
  .content{padding:16px}
  .page-heading h2{font-size:1.9rem}
  .grid-2,.grid-3,.grid-4,.form-grid,.form-grid-3{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .person-card{grid-template-columns:62px 1fr}.person-card .actions{grid-column:1/-1}
  .nom-item .section-actions{grid-template-columns:1fr}.nom-item .actions{justify-content:flex-start}.upload-frame{height:116px}
  .avatar{width:62px;height:62px}
  .tv-grid{grid-template-columns:1fr}.tv-page{display:block}.tv-panel{margin-bottom:12px}
  .content-links{grid-template-columns:1fr}
}
@media (max-width:520px){
  .stats{grid-template-columns:1fr 1fr}.stat strong{font-size:1.35rem}
  .public-header{padding:14px}.public-header h1{font-size:1.55rem}.public-main{padding:14px}
  .guest-hero h1{font-size:1.8rem}.guest-main{padding:14px}
}

  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <h1>SGCES</h1>
      <p>Sistema de Gerenciamento de Cerimonial em Eventos Sociais</p>
    </div>
    <nav class="nav" id="mainNav">
      <button class="active" data-view="dashboard">Dashboard</button>
      <button data-view="evento">Evento</button>
      <button data-view="convidados">Convidados</button>
      <button data-view="mesas">Mesas</button>
      <button data-view="croqui">Croqui</button>
      <button data-view="cerimonial">Cerimonial</button>
      <button data-view="nominata">Nominata</button>
      <button data-view="conteudos">Conteúdos</button>
      <button data-view="acessos">Acessos</button>
    </nav>
    <div class="sidebar-footer">SGCES v1.3.2</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <div>
          <div class="small muted" style="font-weight:800;margin-bottom:4px">EVENTO EM EDIÇÃO</div>
          <select id="eventSelect" class="search-input" style="min-width:300px"></select>
        </div>
        <div id="activeEventLabel" class="active-event-label"><span class="muted">Nenhum evento ativo</span></div>
      </div>
      <div class="topbar-right">
        <span id="syncStatus" class="small muted">Pronto</span>
        <button id="refreshBtn" class="btn btn-sm">Atualizar</button>
      </div>
    </header>

    <div class="content">
      <section data-section="dashboard"></section>
      <section data-section="evento" class="hidden"></section>
      <section data-section="convidados" class="hidden"></section>
      <section data-section="mesas" class="hidden"></section>
      <section data-section="croqui" class="hidden"></section>
      <section data-section="cerimonial" class="hidden"></section>
      <section data-section="nominata" class="hidden"></section>
      <section data-section="conteudos" class="hidden"></section>
      <section data-section="acessos" class="hidden"></section>
    </div>
  </main>
</div>
<script src="config.js"></script>




<script>
(function(){
  let seq = 0;
  let bridgeFrame = null;
  let bridgeReadyPromise = null;
  let bridgeSeq = 0;
  const bridgePending = new Map();

  function readyApi(){
    const u = String(window.SGCES_CONFIG && window.SGCES_CONFIG.API_URL || '');
    return /^https:\/\/script\.google\.com\//.test(u) || /^https:\/\/script\.googleusercontent\.com\//.test(u);
  }

  function call(action, payload, timeoutMs){
    payload = payload || {};
    timeoutMs = timeoutMs || 25000;
    if(!readyApi()) return Promise.reject(new Error('Configure a URL do Web App em config.js.'));

    return new Promise((resolve,reject)=>{
      const id = 'sgces_cb_' + Date.now() + '_' + (++seq);
      const script = document.createElement('script');
      const timer = setTimeout(()=>finish(new Error('Tempo esgotado ao consultar a API.')), timeoutMs);

      function finish(err, data){
        clearTimeout(timer);
        try{ delete window[id]; }catch(e){ window[id]=undefined; }
        if(script.parentNode) script.parentNode.removeChild(script);
        if(err) reject(err); else resolve(data);
      }

      window[id] = function(response){
        if(!response || response.ok !== true) return finish(new Error(response && response.error ? response.error : 'Falha na API.'));
        finish(null, response.data);
      };

      const qs = new URLSearchParams();
      qs.set('action', action);
      qs.set('payload', JSON.stringify(payload));
      qs.set('callback', id);
      qs.set('_', Date.now());
      script.src = window.SGCES_CONFIG.API_URL + (window.SGCES_CONFIG.API_URL.includes('?') ? '&' : '?') + qs.toString();
      script.onerror = ()=>finish(new Error('Não foi possível carregar a API do SGCES.'));
      document.head.appendChild(script);
    });
  }

  function ensureBridge(){
    if(bridgeReadyPromise) return bridgeReadyPromise;
    if(!readyApi()) return Promise.reject(new Error('Configure a URL do Web App em config.js.'));
    bridgeReadyPromise = new Promise((resolve,reject)=>{
      const frame=document.createElement('iframe');
      frame.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0;left:-20px;top:-20px';
      frame.setAttribute('aria-hidden','true');
      const timer=setTimeout(()=>{bridgeReadyPromise=null;try{frame.remove();}catch(e){};reject(new Error('Não foi possível iniciar o canal de upload. Verifique a nova implantação do Apps Script.'));},20000);
      const onMessage=ev=>{
        const m=ev.data||{};
        if(m.type==='SGCES_BRIDGE_READY'){
          clearTimeout(timer);
          bridgeFrame=frame;
          window.removeEventListener('message',onMessage);
          resolve(frame);
        }
      };
      window.addEventListener('message',onMessage);
      const sep=window.SGCES_CONFIG.API_URL.includes('?')?'&':'?';
      frame.src=window.SGCES_CONFIG.API_URL+sep+'bridge=1&origin='+encodeURIComponent(location.origin)+'&_='+Date.now();
      document.body.appendChild(frame);
    });
    return bridgeReadyPromise;
  }

  window.addEventListener('message',ev=>{
    const m=ev.data||{};
    if(m.type!=='SGCES_BRIDGE_RESULT' || !m.id) return;
    const item=bridgePending.get(m.id);
    if(!item)return;
    bridgePending.delete(m.id);
    clearTimeout(item.timer);
    if(!m.ok) return item.reject(new Error(m.error||'Falha no upload.'));
    try{
      const env=JSON.parse(m.raw||'{}');
      if(!env.ok) throw new Error(env.error||'Falha no upload.');
      item.resolve(env.data);
    }catch(e){item.reject(e);}
  });

  async function callBridge(action,payload,timeoutMs){
    timeoutMs=timeoutMs||90000;
    const frame=await ensureBridge();
    return new Promise((resolve,reject)=>{
      const id='sgces_bridge_'+Date.now()+'_'+(++bridgeSeq);
      const timer=setTimeout(()=>{bridgePending.delete(id);reject(new Error('Tempo esgotado durante o upload.'));},timeoutMs);
      bridgePending.set(id,{resolve,reject,timer});
      frame.contentWindow.postMessage({type:'SGCES_BRIDGE_CALL',id,action,payload:payload||{}},'*');
    });
  }

  function uploaderUrl(kind,targetId){
    if(!readyApi()) return '';
    const qs=new URLSearchParams();
    qs.set('uploader','1');qs.set('kind',String(kind||''));qs.set('targetId',String(targetId||''));qs.set('origin',location.origin);qs.set('_',Date.now());
    return window.SGCES_CONFIG.API_URL+(window.SGCES_CONFIG.API_URL.includes('?')?'&':'?')+qs.toString();
  }

  window.SGCES_API = { call, callBridge, uploaderUrl, readyApi };
})();

</script>
<script>
(function(){
  const $ = (sel,root=document)=>root.querySelector(sel);
  const $$ = (sel,root=document)=>Array.from(root.querySelectorAll(sel));
  const esc = s=>String(s==null?'':s).replace(/[&<>'"]/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[c]));
  const yes = v=>['SIM','S','YES','TRUE','1'].includes(String(v||'').toUpperCase()) || v===true || v===1;
  const num = (v,d=0)=>{ const n=Number(v); return Number.isFinite(n)?n:d; };
  const dateInputValue = v=>{
    if(!v) return '';
    const s=String(v).trim();
    let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m) return `${m[1]}-${m[2]}-${m[3]}`;
    m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
    const d=new Date(v);
    if(Number.isNaN(d.getTime())) return '';
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  };
  const fmtDate = v=>{
    const iso=dateInputValue(v);
    if(!iso) return String(v||'');
    const [y,m,d]=iso.split('-');
    return `${d}/${m}/${y}`;
  };
  const timeInputValue = v=>{
    if(!v) return '';
    const s=String(v).trim();
    let m=s.match(/(?:^|T)(\d{1,2}):(\d{2})/);
    if(m) return `${String(m[1]).padStart(2,'0')}:${m[2]}`;
    m=s.match(/^(\d{1,2})[hH:](\d{2})$/);
    return m?`${String(m[1]).padStart(2,'0')}:${m[2]}`:'';
  };
  const fmtTime = v=>{
    if(!v) return '';
    const simple=timeInputValue(v);
    if(simple) return simple;
    const d = new Date(v);
    if(Number.isNaN(d.getTime())) return String(v).slice(0,5);
    return new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
  };
  const normalize = s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const byPrecedence = (a,b)=>{
    const pa=num(a.ORDEM_PRECEDENCIA,999999)||999999;
    const pb=num(b.ORDEM_PRECEDENCIA,999999)||999999;
    return pa-pb || String(a.NOME_COMPLETO||'').localeCompare(String(b.NOME_COMPLETO||''),'pt-BR');
  };
  const displayName = g=>[g.POSTO_GRAD,g.NOME_GUERRA||g.NOME_COMPLETO].filter(Boolean).join(' ').trim();
  const tableName = t=>t ? (t.NOME || ('Mesa '+t.NUMERO)) : 'Sem mesa';

  function driveImage(url){
    url=String(url||'').trim();
    if(!url) return '';
    const m=url.match(/\/d\/([A-Za-z0-9_-]+)/) || url.match(/[?&]id=([A-Za-z0-9_-]+)/);
    if(m && /drive\.google\.com/.test(url)) return 'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1200';
    return url;
  }

  function toast(msg,type){
    let wrap=$('.toast-wrap');
    if(!wrap){ wrap=document.createElement('div'); wrap.className='toast-wrap'; document.body.appendChild(wrap); }
    const el=document.createElement('div'); el.className='toast '+(type||''); el.textContent=msg; wrap.appendChild(el);
    setTimeout(()=>el.remove(),3600);
  }

  function setBusy(el,busy,label){
    if(!el) return;
    if(busy){
      if(!el.dataset.original) el.dataset.original=el.innerHTML;
      el.disabled=true; el.innerHTML='<span class="spinner"></span> '+(label||'Aguarde');
    }else{
      el.disabled=false; if(el.dataset.original){el.innerHTML=el.dataset.original; delete el.dataset.original;}
    }
  }

  function modal(title, bodyHtml, footerHtml){
    const bd=document.createElement('div'); bd.className='modal-backdrop';
    bd.innerHTML=`<div class="modal"><div class="modal-head"><h3>${esc(title)}</h3><button class="btn icon-btn" data-close>&times;</button></div><div class="modal-body">${bodyHtml}</div><div class="modal-foot">${footerHtml||'<button class="btn" data-close>Fechar</button>'}</div></div>`;
    bd.addEventListener('click',e=>{ if(e.target===bd || e.target.closest('[data-close]')) bd.remove(); });
    document.body.appendChild(bd); return bd;
  }

  function badgeStatus(v){
    const s=String(v||'').toUpperCase();
    let cls='';
    if(['PRESENTE','CONFIRMADO','SIM','ATIVO'].includes(s)) cls='success';
    else if(['PENDENTE','RASCUNHO'].includes(s)) cls='warning';
    else if(['NÃO COMPARECERÁ','NAO COMPARECERA','ARQUIVADO','NAO'].includes(s)) cls='danger';
    return `<span class="badge ${cls}">${esc(v||'—')}</span>`;
  }

  function renderFloor(container,tables,opts){
    opts=opts||{}; container.innerHTML=''; container.classList.add(opts.tv?'tv-floor':'floor');
    const bg=String(opts.backgroundUrl||'').trim();
    if(bg){container.style.backgroundImage=`url("${driveImage(bg).replace(/"/g,'%22')}")`;container.style.backgroundSize='contain';container.style.backgroundPosition='center';container.style.backgroundRepeat='no-repeat';}
    else{container.style.backgroundImage='';container.style.backgroundSize='';container.style.backgroundPosition='';container.style.backgroundRepeat='';}
    const highlighted=String(opts.highlightTableId||'');
    const ratio=(container.clientWidth&&container.clientHeight)?container.clientWidth/container.clientHeight:(16/9);
    (tables||[]).forEach(t=>{
      const el=document.createElement('div');
      const shape=String(t.FORMATO||'REDONDA').toUpperCase();
      el.className='floor-table '+(shape==='RETANGULAR'?'rect':shape==='U'?'u':'round');
      if(String(t.ID_MESA)===highlighted) el.classList.add('highlight');
      if(num(t.VAGAS,1)<=0 && num(t.CAPACIDADE)>0) el.classList.add('full');
      el.dataset.id=t.ID_MESA; el.dataset.shape=shape;
      const w=num(t.W,shape==='RETANGULAR'?18:10);
      const h=shape==='REDONDA'?w*ratio:num(t.H,shape==='RETANGULAR'?8:10);
      el.style.left=num(t.X,50)+'%'; el.style.top=num(t.Y,50)+'%'; el.style.width=w+'%'; el.style.height=h+'%';
      el.style.transform=`translate(-50%,-50%) rotate(${num(t.ROTACAO,0)}deg)`;
      const occ = typeof t.OCUPACAO!=='undefined' ? `<span class="occ">${num(t.OCUPACAO)}/${num(t.CAPACIDADE)}${typeof t.VAGAS!=='undefined'?' • '+num(t.VAGAS)+' vaga(s)':''}</span>` : '';
      el.innerHTML=`<div>${esc(t.NOME||('Mesa '+t.NUMERO))}${occ}</div>${opts.editor?'<span class="resize-handle" title="Redimensionar"></span>':''}`;
      if(opts.onClick) el.addEventListener('click',()=>opts.onClick(t,el));
      container.appendChild(el);
    });
  }

  function seatCoordinates(table, seatCode, total){
    const format=String(table.FORMATO||'REDONDA').toUpperCase();
    total=Math.max(num(table.CAPACIDADE,8),total||0);
    if(format==='REDONDA'){
      const i=num(String(seatCode).replace('R',''),0), angle=(-90)+(360*i/total), rad=190;
      return {x:450+Math.cos(angle*Math.PI/180)*rad,y:250+Math.sin(angle*Math.PI/180)*rad};
    }
    if(format==='U'){
      const pos=num(String(seatCode).replace('U',''),1);
      // Posições 1.. alternam a partir do centro da base e depois sobem pelas laterais.
      const baseCount=Math.min(5,total), sideRest=Math.max(0,total-baseCount), leftCount=Math.ceil(sideRest/2), rightCount=Math.floor(sideRest/2);
      if(pos<=baseCount){
        const order=[0,1,-1,2,-2]; const offset=order[pos-1]||0; return {x:450+offset*82,y:405};
      }
      const k=pos-baseCount;
      if(k%2===1){ const idx=Math.ceil(k/2); return {x:235,y:355-(idx-1)*82}; }
      const idx=k/2; return {x:665,y:355-(idx-1)*82};
    }
    const heads=yes(table.CABECEIRAS);
    let side=total-(heads?2:0), top=Math.ceil(side/2), bottom=Math.floor(side/2);
    const code=String(seatCode||'');
    if(code==='L') return {x:160,y:250};
    if(code==='R') return {x:740,y:250};
    if(code.startsWith('T')){ const i=num(code.slice(1)); return {x:260+(top<=1?0:i*(380/(top-1))),y:135}; }
    if(code.startsWith('B')){ const i=num(code.slice(1)); return {x:260+(bottom<=1?0:i*(380/(bottom-1))),y:365}; }
    return {x:450,y:90};
  }

  function renderSeating(container,table,guests){
    container.innerHTML='<div class="seating-canvas"></div>';
    const canvas=container.firstElementChild;
    const format=String(table.FORMATO||'REDONDA').toUpperCase();
    const shape=document.createElement('div'); shape.className='table-shape '+(format==='RETANGULAR'?'rect':format==='U'?'u':'round'); canvas.appendChild(shape);
    (guests||[]).filter(g=>g.ASSENTO).forEach(g=>{
      const p=seatCoordinates(table,g.ASSENTO,Math.max(2,(guests||[]).length));
      const s=document.createElement('div'); s.className='seat'; s.style.left=p.x+'px'; s.style.top=p.y+'px';
      const nome=[g.POSTO_GRAD,g.NOME_GUERRA||g.NOME_COMPLETO].filter(Boolean).join(' ');
      s.title=[nome,g.CARGO,g.NOME_COMPLETO].filter(Boolean).join(' • ');
      const cardH=Math.max(122,Math.min(190,56+nome.length*5.2));
      s.style.height=cardH+'px';
      s.innerHTML=`<div class="seat-vertical" style="width:${Math.max(108,cardH-14)}px;font-size:${nome.length>25?'.68rem':nome.length>20?'.71rem':'.74rem'}">${esc(nome)}</div>`;
      canvas.appendChild(s);
    });
  }

  window.SGCES_UI={$, $$, esc, yes, num, fmtDate, fmtTime, dateInputValue, timeInputValue, normalize, byPrecedence, displayName, tableName, driveImage, toast, setBusy, modal, badgeStatus, renderFloor, renderSeating, seatCoordinates};
})();

</script>
<script>
(function(){
  const U=window.SGCES_UI, A=window.SGCES_API;
  const state={events:[],eventId:'',activeEventId:'',postos:[],data:{event:null,guests:[],tables:[],contents:[],sponsors:[],stats:{}},view:'dashboard',selectedCerimonialTable:''};

  document.addEventListener('DOMContentLoaded',init);

  async function init(){
    bindShell();
    bindUploadMessages();
    await bootstrap();
  }

  function bindUploadMessages(){
    window.addEventListener('message',async ev=>{
      const m=ev.data||{};
      if(m.type==='SGCES_UPLOAD_ERROR'){
        U.toast(m.error||'Falha no upload.','error');
        return;
      }
      if(m.type!=='SGCES_UPLOAD_DONE')return;
      try{
        if(m.kind==='FOTO'){
          const preview=U.$('#gPhotoPreview');
          if(preview && m.data && m.data.url) preview.innerHTML=`<img src="${U.esc(U.driveImage(m.data.url))}" alt="Foto">`;
          await loadEvent();
          U.toast('Foto enviada para o Google Drive.','success');
        }else if(m.kind==='CROQUI'){
          await loadEvent();
          if(state.view==='croqui')renderCroqui();
          U.toast('Imagem do croqui enviada para o Google Drive.','success');
        }
      }catch(err){U.toast(err.message||String(err),'error');}
    });
  }

  function bindShell(){
    U.$$('#mainNav button').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));
    U.$('#refreshBtn').addEventListener('click',refresh);
    U.$('#eventSelect').addEventListener('change',async e=>{
      const id=e.target.value;
      state.eventId=id;
      try{ localStorage.setItem('sgces_selected_event',id||''); }catch(err){}
      if(!id){ state.data={event:null,guests:[],tables:[],contents:[],sponsors:[],stats:{}}; updateEventIndicator(); renderAll(); return; }
      await runBusy(async()=>{ await loadEvent(); });
    });
  }

  function showView(view){
    state.view=view;
    U.$$('#mainNav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
    U.$$('[data-section]').forEach(s=>s.classList.toggle('hidden',s.dataset.section!==view));
    renderView(view);
  }

  async function bootstrap(){
    await runBusy(async()=>{
      let remembered='';
      try{ remembered=localStorage.getItem('sgces_selected_event')||''; }catch(err){}
      const b=await A.call('bootstrap',{eventId:state.eventId||remembered});
      state.events=b.events||[];
      state.activeEventId=b.activeEventId||'';
      state.postos=b.postos||[];
      const valid=id=>id&&state.events.some(e=>String(e.ID_EVENTO)===String(id));
      state.eventId=valid(state.eventId)?state.eventId:(valid(remembered)?remembered:(b.selectedEventId||state.activeEventId||''));
      try{ localStorage.setItem('sgces_selected_event',state.eventId||''); }catch(err){}
      fillEventSelect();
      if(state.eventId) await loadEvent(); else renderAll();
    },'Conectando');
  }

  async function refresh(){
    await runBusy(async()=>{
      const b=await A.call('bootstrap',{eventId:state.eventId});
      state.events=b.events||[];
      state.activeEventId=b.activeEventId||'';
      state.postos=b.postos||state.postos||[];
      if(!state.eventId) state.eventId=b.selectedEventId||state.activeEventId||'';
      fillEventSelect();
      if(state.eventId) await loadEvent(); else renderAll();
    });
  }

  async function loadEvent(){
    if(!state.eventId) return;
    state.data=await A.call('eventData',{eventId:state.eventId});
    state.data.guests=(state.data.guests||[]).sort(U.byPrecedence);
    renderAll();
  }

  function fillEventSelect(){
    const sel=U.$('#eventSelect');
    sel.innerHTML='<option value="">Selecione um evento</option>'+state.events.map(e=>`<option value="${U.esc(e.ID_EVENTO)}" ${String(e.ID_EVENTO)===String(state.eventId)?'selected':''}>${U.esc(e.NOME)}${String(e.ID_EVENTO)===String(state.activeEventId)?' • ATIVO':''}</option>`).join('');
    updateEventIndicator();
  }

  function updateEventIndicator(){
    const el=U.$('#activeEventLabel'); if(!el)return;
    const active=state.events.find(e=>String(e.ID_EVENTO)===String(state.activeEventId));
    el.innerHTML=active?`<span class="active-dot"></span> Evento ativo: <strong>${U.esc(active.NOME)}</strong>`:'<span class="muted">Nenhum evento ativo</span>';
  }

  function renderAll(){
    ['dashboard','evento','convidados','mesas','croqui','cerimonial','nominata','conteudos','acessos'].forEach(renderView);
  }
  function renderView(v){
    const fn={dashboard:renderDashboard,evento:renderEvento,convidados:renderConvidados,mesas:renderMesas,croqui:renderCroqui,cerimonial:renderCerimonial,nominata:renderNominata,conteudos:renderConteudos,acessos:renderAcessos}[v];
    if(fn) fn();
  }

  function heading(title,subtitle,actions){
    return `<div class="page-heading"><div><h2>${U.esc(title)}</h2><p>${U.esc(subtitle||'')}</p></div><div class="actions">${actions||''}</div></div>`;
  }
  function requireEvent(container,title){
    if(state.data.event) return false;
    container.innerHTML=heading(title,'Nenhum evento selecionado.')+`<div class="card"><p>Crie o primeiro evento para iniciar o SGCES.</p><button class="btn btn-primary" data-new-event>Criar evento</button></div>`;
    container.querySelector('[data-new-event]').addEventListener('click',()=>eventModal());
    return true;
  }

  function renderDashboard(){
    const c=U.$('[data-section="dashboard"]');
    if(requireEvent(c,'Dashboard')) return;
    const s=state.data.stats||{}, latest=(state.data.guests||[]).filter(g=>String(g.CHECKIN).toUpperCase()==='PRESENTE'&&g.HORARIO_CHECKIN).sort((a,b)=>String(b.HORARIO_CHECKIN).localeCompare(String(a.HORARIO_CHECKIN))).slice(0,6);
    c.innerHTML=heading('Dashboard',state.data.event.NOME,`<button class="btn btn-soft" data-open-reception>Recepção</button><button class="btn btn-soft" data-open-tv>TV</button>`)+`
      <div class="stats">
        ${stat('Convidados',s.totalGuests)}${stat('Confirmados',s.confirmed)}${stat('Presentes',s.present)}${stat('Autoridades',s.authorities)}${stat('Nominata',s.nominata)}${stat('Vagas livres',s.freeSeats)}
      </div>
      <div class="grid grid-2">
        <div class="card"><h3>Croqui geral</h3><div class="floor-wrap"><div class="floor" id="dashFloor"></div></div></div>
        <div class="card"><h3>Últimas chegadas</h3>${latest.length?`<div class="table-wrap"><table><thead><tr><th>Horário</th><th>Convidado</th><th>Mesa</th></tr></thead><tbody>${latest.map(g=>`<tr><td>${U.fmtTime(g.HORARIO_CHECKIN)}</td><td>${U.esc(U.displayName(g))}</td><td>${U.esc(tableFor(g.MESA_ID)?.NOME||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Ainda não há check-ins.</p>'}</div>
      </div>`;
    U.renderFloor(U.$('#dashFloor'),state.data.tables||[],{backgroundUrl:state.data.event&&state.data.event.CROQUI_URL});
    c.querySelector('[data-open-reception]').onclick=()=>window.open('recepcao.html?evento='+encodeURIComponent(state.eventId),'_blank');
    c.querySelector('[data-open-tv]').onclick=()=>window.open('tv.html?evento='+encodeURIComponent(state.eventId),'_blank');
  }
  function stat(label,value){return `<div class="stat"><span>${U.esc(label)}</span><strong>${U.num(value)}</strong></div>`;}

  function renderEvento(){
    const c=U.$('[data-section="evento"]');
    const e=state.data.event;
    c.innerHTML=heading('Evento','Configuração geral do evento.',`<button class="btn btn-primary" data-new>Novo evento</button>${e?'<button class="btn" data-edit>Editar evento</button>':''}`)+(!e?`<div class="card"><p>Nenhum evento selecionado.</p></div>`:`
      <div class="grid grid-2">
        <div class="card"><h3>${U.esc(e.NOME)}</h3><p class="muted">${U.esc(e.SUBTITULO||'')}</p>
          <div class="table-wrap"><table><tbody>
          <tr><th>Data</th><td>${U.esc(U.fmtDate(e.DATA)||'—')}</td></tr><tr><th>Horário</th><td>${U.esc(U.fmtTime(e.HORARIO)||'—')}</td></tr><tr><th>Local</th><td>${U.esc(e.LOCAL||'—')}</td></tr><tr><th>Modo padrão</th><td>${U.esc(e.MODO_PADRAO||'—')}</td></tr><tr><th>Status</th><td>${U.badgeStatus(e.STATUS)}</td></tr>
          </tbody></table></div>
          <div class="actions" style="margin-top:12px">${String(e.ID_EVENTO)===String(state.activeEventId)?'<span class="badge success">EVENTO ATIVO</span>':(String(e.STATUS).toUpperCase()==='ARQUIVADO'?'<span class="badge">ARQUIVADO</span>':'<button class="btn btn-success" data-activate>Ativar este evento</button>')}${String(e.STATUS).toUpperCase()!=='ARQUIVADO'?'<button class="btn btn-danger" data-archive>Arquivar</button>':''}</div>
        </div>
        <div class="card"><h3>Banner</h3>${e.BANNER_URL?`<img src="${U.esc(U.driveImage(e.BANNER_URL))}" alt="Banner" style="width:100%;max-height:320px;object-fit:contain;border-radius:12px;background:#f8fafc">`:'<p class="muted">Nenhum banner configurado.</p>'}<h3 style="margin-top:18px">Observações</h3><p>${U.esc(e.OBSERVACOES||'—')}</p></div>
      </div>`);
    c.querySelector('[data-new]').onclick=()=>eventModal();
    if(e){
      c.querySelector('[data-edit]').onclick=()=>eventModal(e);
      const activate=c.querySelector('[data-activate]'); if(activate) activate.onclick=()=>runBusy(async()=>{await A.call('setActiveEvent',{eventId:e.ID_EVENTO});state.activeEventId=e.ID_EVENTO;await bootstrap();U.toast('Evento ativo atualizado.','success');});
      const ar=c.querySelector('[data-archive]'); if(ar) ar.onclick=()=>{if(confirm('Arquivar este evento?')) runBusy(async()=>{await A.call('archiveEvent',{eventId:e.ID_EVENTO});await bootstrap();});};
    }
  }

  function eventModal(e){
    e=e||{};
    const m=U.modal(e.ID_EVENTO?'Editar evento':'Novo evento',`
      <div class="form-grid">
        ${field('Nome','evNome',e.NOME,'text',true)}${field('Subtítulo','evSub',e.SUBTITULO)}
        ${field('Data','evData',U.dateInputValue(e.DATA),'date')}${field('Horário','evHorario',U.timeInputValue(e.HORARIO),'time')}
        ${field('Local','evLocal',e.LOCAL)}${selectField('Modo padrão','evModo',['FIXO','RESERVA','LIVRE','HÍBRIDO'],e.MODO_PADRAO||'HÍBRIDO')}
        <div class="field"><label>Status</label><div style="padding:10px 0">${U.badgeStatus(e.STATUS||'RASCUNHO')}</div><div class="small muted">O evento ativo é definido pelo botão “Ativar este evento”. Trocar o evento em edição não altera o evento operacional.</div></div>
        <div class="field" style="grid-column:1/-1"><label>URL do banner</label><input id="evBanner" value="${U.esc(e.BANNER_URL||'')}"></div>
        <div class="field" style="grid-column:1/-1"><label>Observações</label><textarea id="evObs">${U.esc(e.OBSERVACOES||'')}</textarea></div>
      </div>`, `<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-save>Salvar</button>`);
    m.querySelector('[data-save]').onclick=async ev=>{
      const btn=ev.currentTarget; U.setBusy(btn,true);

  function parseImport(text){
    const lines=String(text||'').trim().split(/\r?\n/).filter(Boolean); if(lines.length<2)return[];
    const delim=lines[0].includes('\t')?'\t':lines[0].includes(';')?';':',';
    const h=lines[0].split(delim).map(x=>U.normalize(x).replace(/[^a-z0-9]/g,''));
    const pick=(obj,names)=>{for(const n of names){const idx=h.indexOf(n);if(idx>=0)return obj[idx]||'';}return'';};
    return lines.slice(1).map((line,idx)=>({r:line.split(delim),idx})).filter(x=>x.r.some(Boolean)).map(x=>{
      const r=x.r, mesaTxt=pick(r,['mesa','numeromesa']); const mesa=(state.data.tables||[]).find(t=>String(t.NUMERO)===String(mesaTxt)||U.normalize(t.NOME)===U.normalize(mesaTxt));
      const tipo=(pick(r,['tipo'])||'TITULAR').toUpperCase();
      const nivel=String(pick(r,['nivel','nivelinteresse'])||'CONVIDADO').toUpperCase()==='AUTORIDADE'?'AUTORIDADE':'CONVIDADO';
      return {__idx:x.idx,postoGrad:pick(r,['postograd','posto','postograduacao']),nomeCompleto:pick(r,['nomecompleto','nome']),nomeGuerra:pick(r,['nomeguerra']),
        tipo,titularNome:pick(r,['titulargrupo','titular','grupotitular']),cargo:pick(r,['cargo','funcao']),omOrgao:pick(r,['omorgao','om','orgao']),
        sexo:pick(r,['sexo']),rsvp:pick(r,['rsvp','status'])||'PENDENTE',mesaId:mesa?mesa.ID_MESA:'',
        nominata:/^(sim|s|1|true)$/i.test(pick(r,['nominata','autoridadeinteresse']))?'SIM':'NAO',nivel,
        email:pick(r,['email']),telefone:pick(r,['telefone','celular']),fotoUrl:pick(r,['fotourl','foto']),
        obsRecepcao:pick(r,['obsrecepcao','observacao','obs']),acompanhanteNome:pick(r,['acompanhante','nomeacompanhante'])};
    }).filter(x=>x.nomeCompleto);
  }

  async function optimizeImageFile(file){
    if(!file || !/^image\//i.test(file.type||''))throw new Error('Selecione um arquivo de imagem.');
    const original=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Não foi possível ler a imagem.'));r.readAsDataURL(file);});
    if(file.size<=1500000)return original;
    const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Imagem inválida.'));im.src=original;});
    const max=2200,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
    return canvas.toDataURL('image/jpeg',0.88);
  }

  async function uploadCroquiImage(file,eventId,oldUrl){
    if(!A.readyApi())throw new Error('Configure a URL do Web App em config.js.');
    const dataUrl=await optimizeImageFile(file);
    const r=await A.callBridge('uploadEventImage',{eventId:eventId,fileName:file.name,dataUrl:dataUrl},90000);
    if(!r || !r.url)throw new Error('A imagem não foi gravada. Execute “SGCES > Autorizar fotos e croquis” na planilha e atualize a implantação do Web App.');
    return r.url;
  }

  function enableFloorEditing(floor){
    floor.querySelectorAll('.floor-table').forEach(el=>{
      let move=null,resize=null;
      el.addEventListener('pointerdown',e=>{
        if(e.target.classList.contains('resize-handle'))return;
        e.preventDefault();el.setPointerCapture(e.pointerId);move={x:e.clientX,y:e.clientY,left:parseFloat(el.style.left),top:parseFloat(el.style.top)};el.classList.add('dragging');
      });
      el.addEventListener('pointermove',e=>{if(!move)return;const r=floor.getBoundingClientRect();const dx=(e.clientX-move.x)/r.width*100,dy=(e.clientY-move.y)/r.height*100;el.style.left=Math.max(2,Math.min(98,move.left+dx))+'%';el.style.top=Math.max(2,Math.min(98,move.top+dy))+'%';});
      const endMove=()=>{move=null;el.classList.remove('dragging');}; el.addEventListener('pointerup',endMove);el.addEventListener('pointercancel',endMove);
      const h=el.querySelector('.resize-handle'); if(!h)return;
      h.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();h.setPointerCapture(e.pointerId);const fr=floor.getBoundingClientRect(),er=el.getBoundingClientRect();resize={x:e.clientX,y:e.clientY,w:er.width,h:er.height,fw:fr.width,fh:fr.height,shape:el.dataset.shape};});
      h.addEventListener('pointermove',e=>{if(!resize)return;e.preventDefault();e.stopPropagation();let newW=Math.max(46,resize.w+(e.clientX-resize.x));let newH=Math.max(34,resize.h+(e.clientY-resize.y));if(resize.shape==='REDONDA'){const d=Math.max(46,Math.max(newW,newH));newW=d;newH=d;}el.style.width=Math.min(55,newW/resize.fw*100)+'%';el.style.height=Math.min(70,newH/resize.fh*100)+'%';});
      const endResize=e=>{if(e){e.preventDefault();e.stopPropagation();}resize=null;};h.addEventListener('pointerup',endResize);h.addEventListener('pointercancel',endResize);
    });
  }

    c.querySelectorAll('[data-ds]').forEach(b=>b.onclick=()=>{if(confirm('Excluir patrocinador?'))runBusy(async()=>{await A.call('deleteSponsor',{id:b.dataset.ds});await loadEvent();});});
  }

  function contentModal(x){x=x||{};const m=U.modal(x.ID_CONTEUDO?'Editar conteúdo':'Adicionar conteúdo',`<div class="form-grid">${field('Título','cTit',x.TITULO)}${selectField('Tipo','cTipo',['CARDAPIO','PROGRAMA','HOMENAGEM','ARQUIVO'],x.TIPO||'ARQUIVO')}<div class="field" style="grid-column:1/-1"><label>URL do arquivo / página</label><input id="cUrl" value="${U.esc(x.URL||'')}"></div>${field('Ordem','cOrd',x.ORDEM||0,'number')}${selectField('Visível','cVis',['SIM','NAO'],x.VISIVEL||'SIM')}</div>`,`<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-save>Salvar</button>`);m.querySelector('[data-save]').onclick=async e=>{const b=e.currentTarget;U.setBusy(b,true);try{await A.call('saveContent',{id:x.ID_CONTEUDO||'',eventId:state.eventId,titulo:U.$('#cTit',m).value.trim(),tipo:U.$('#cTipo',m).value,url:U.$('#cUrl',m).value.trim(),ordem:U.$('#cOrd',m).value,visivel:U.$('#cVis',m).value});m.remove();await loadEvent();}catch(err){U.toast(err.message,'error');}finally{U.setBusy(b,false);}};}
  function sponsorModal(x){x=x||{};const m=U.modal(x.ID_PATROCINADOR?'Editar patrocinador':'Adicionar patrocinador',`<div class="form-grid">${field('Nome','sNome',x.NOME)}<div class="field"><label>URL da logo</label><input id="sLogo" value="${U.esc(x.LOGO_URL||'')}"></div><div class="field" style="grid-column:1/-1"><label>Site (opcional)</label><input id="sSite" value="${U.esc(x.URL_SITE||'')}"></div>${field('Ordem','sOrd',x.ORDEM||0,'number')}${selectField('Visível','sVis',['SIM','NAO'],x.VISIVEL||'SIM')}</div>`,`<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-save>Salvar</button>`);m.querySelector('[data-save]').onclick=async e=>{const b=e.currentTarget;U.setBusy(b,true);try{await A.call('saveSponsor',{id:x.ID_PATROCINADOR||'',eventId:state.eventId,nome:U.$('#sNome',m).value.trim(),logoUrl:U.$('#sLogo',m).value.trim(),urlSite:U.$('#sSite',m).value.trim(),ordem:U.$('#sOrd',m).value,visivel:U.$('#sVis',m).value});m.remove();await loadEvent();}catch(err){U.toast(err.message,'error');}finally{U.setBusy(b,false);}};}

  function renderAcessos(){
    const c=U.$('[data-section="acessos"]');if(requireEvent(c,'Acessos'))return;
    const base=location.href.replace(/[^\/]*([?#].*)?$/,'');
    const evt='?evento='+encodeURIComponent(state.eventId);
    const lookup=base+'convidado.html'+evt;
    const reserve=base+'convidado.html'+evt+'&modo=reserva';
    const urls=[
      ['Recepção',base+'recepcao.html'+evt,'Interface operacional para localizar pessoas, confirmar chegada, acessar Nominata e croqui.'],
      ['Portal do convidado',lookup,'Link para o convidado pesquisar o próprio nome, localizar a mesa e confirmar quem chegou no seu grupo.'],
      ['Reserva de mesas',reserve,'Este é o link a compartilhar quando o evento permitir reserva remota. Mesas marcadas como “Mesa de autoridades” ficam bloqueadas automaticamente.'],
      ['Painel da TV',base+'tv.html'+evt,'Painel deste evento com croqui, ocupação e últimas chegadas.']
    ];
    c.innerHTML=heading('Acessos','Os links abaixo já estão vinculados ao evento em edição.')+`<div class="grid grid-2">${urls.map(([n,u,d])=>`<div class="card"><h3>${U.esc(n)}</h3><p class="muted">${U.esc(d)}</p><div class="field"><input readonly value="${U.esc(u)}"></div><div class="actions" style="margin-top:10px"><button class="btn" data-copy="${U.esc(u)}">Copiar link</button><a class="btn btn-primary" href="${U.esc(u)}" target="_blank">Abrir</a></div></div>`).join('')}</div>`;
    c.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);U.toast('Link copiado.','success');}catch(e){U.toast('Não foi possível copiar automaticamente.','error');}});
  }

  function field(label,id,value,type,required){return `<div class="field"><label>${U.esc(label)}</label><input id="${id}" type="${type||'text'}" value="${U.esc(value||'')}" ${required?'required':''}></div>`;}
  function selectField(label,id,opts,value){return `<div class="field"><label>${U.esc(label)}</label><select id="${id}">${opts.map(o=>`<option value="${U.esc(o)}" ${String(o)===String(value)?'selected':''}>${U.esc(o||'—')}</option>`).join('')}</select></div>`;}
  function guestById(id){return (state.data.guests||[]).find(x=>String(x.ID_CONVIDADO)===String(id));}
  function tableById(id){return (state.data.tables||[]).find(x=>String(x.ID_MESA)===String(id));}
  function tableFor(id){return tableById(id);}
  async function runBusy(fn,label){
    const s=U.$('#syncStatus');if(s){s.innerHTML='<span class="spinner"></span> '+(label||'Atualizando');}
    try{return await fn();}catch(err){console.error(err);U.toast(err.message||String(err),'error');}finally{if(s)s.textContent='Pronto';}
  }
})();

</script>
</body>
</html>
