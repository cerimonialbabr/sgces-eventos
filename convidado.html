<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evento — Localize sua mesa</title><link rel="stylesheet" href="assets/style.css"><script src="config.js"></script><script src="assets/api.js"></script></head><body>
<header><h1 id="title">Portal do Convidado</h1></header><main><div id="app"></div></main><script>document.body.insertAdjacentHTML('beforeend',foot())</script>
<script>
const eventId=qs('evento');let E=null,G=null,T=[];async function init(){try{E=await apiGet('publicEvent',{evento:eventId});title.textContent=E.nome;home()}catch(e){app.innerHTML=`<div class=panel><h2>Evento indisponível</h2><p>${esc(e.message)}</p></div>`}}
function home(){app.innerHTML=`${E.banner?`<img class=banner src="${esc(E.banner)}">`:''}<div class="panel search-box"><h2>Encontre seu nome</h2><p class=muted>Digite pelo menos duas letras do seu nome ou nome de guerra.</p><input id=q placeholder="Buscar convidado..." autocomplete=off oninput=searchSoon()><div id=results></div></div>${contentsHtml()}`}
let tm;function searchSoon(){clearTimeout(tm);tm=setTimeout(search,250)}async function search(){const v=q.value.trim();if(v.length<2){results.innerHTML='';return}try{const a=await apiGet('publicSearchGuests',{evento:eventId,q:v});results.innerHTML=a.length?a.map(r=>`<div class=result-card onclick='openGuest(${JSON.stringify(String(r.id))})'><div class=result-main><b>${esc(r.posto)} ${esc(r.nome)}</b><span>${esc(r.organizacao)}</span></div><span>›</span></div>`).join(''):'<p class=muted>Nenhum convidado encontrado.</p>'}catch(e){toast(e.message,true)}}
async function openGuest(id){try{G=await apiGet('publicGuest',{evento:eventId,id});T=await apiGet('publicTables',{evento:eventId});guestView()}catch(e){toast(e.message,true)}}
function guestView(){const confirmed=G.rsvp==='CONFIRMADO';app.innerHTML=`${E.banner?`<img class=banner src="${esc(E.banner)}">`:''}<div class="panel guest-hero"><p class=muted>Convidado</p><h2>${esc(G.posto)} ${esc(G.nome)}</h2><p>${esc(G.cargo)}${G.organizacao?' — '+esc(G.organizacao):''}</p><p>${tableBadge(G.rsvp)}</p><div class=actions style="justify-content:center"><button class=success onclick="confirmRSVP('CONFIRMADO')">${confirmed?'Presença confirmada':'Confirmar presença'}</button><button class=danger onclick="confirmRSVP('NAO_COMPARECERA')">Não comparecerei</button></div>${G.mesa?`<hr><p class=muted>Sua mesa</p><div class=mesa>MESA ${esc(G.mesa.numero)}</div><p>${esc(G.mesa.nome)}</p><button onclick=showMyMap()>Ver no croqui</button>`:`<hr><p class=muted>Você ainda não possui mesa fixa.</p><button onclick=chooseTable()>Escolher / informar mesa</button>`}<p><button class=secondary onclick=home()>Voltar à busca</button></p></div>${contentsHtml()}`}
async function confirmRSVP(status){try{await apiPost('publicConfirm',{evento:eventId,id:G.id,status});G.rsvp=status;toast(status==='CONFIRMADO'?'Presença confirmada':'Resposta registrada');guestView()}catch(e){toast(e.message,true)}}
function showMyMap(){app.innerHTML=`<div class=panel><h2>Sua mesa: ${esc(G.mesa.numero)}</h2><div id=floor class=floor></div><p><button class=secondary onclick=guestView()>Voltar</button></p></div>`;renderFloor(floor,T,{background:E.croquiFundo,highlight:G.mesa.id,showVacancies:false})}
function chooseTable(){const free=T.filter(t=>t.politica!=='FIXO'&&Number(t.vagas)>0);app.innerHTML=`<div class=panel><h2>Escolha ou confirme a mesa</h2><p class=muted>Mesas disponíveis no momento. A ocupação é validada novamente ao confirmar.</p><div id=floor class=floor></div><p><button class=secondary onclick=guestView()>Voltar</button></p></div>`;renderFloor(floor,free,{background:E.croquiFundo,showVacancies:true,click:t=>seatAt(t)})}
async function seatAt(t){if(!confirm(`Confirmar Mesa ${t.numero}?`))return;try{const r=await apiPost('publicSeatAtTable',{evento:eventId,id:G.id,tableId:t.id});toast('Mesa confirmada');G=await apiGet('publicGuest',{evento:eventId,id:G.id});T=await apiGet('publicTables',{evento:eventId});guestView()}catch(e){toast(e.message,true)}}
function contentsHtml(){if(!E||!E.conteudos)return'';const normal=E.conteudos.filter(c=>c.tipo!=='PATROCINADOR'),sponsors=E.conteudos.filter(c=>c.tipo==='PATROCINADOR');return `<div class=panel><h3>Informações do evento</h3><div class="grid g3">${normal.map(c=>`<a class=content-card target=_blank href="${esc(c.url)}"><b>${esc(c.titulo)}</b><br><span class=muted>${esc(c.tipo)}</span></a>`).join('')}</div>${sponsors.length?`<hr><h3 style="text-align:center">Patrocinadores</h3><div class=sponsor-strip>${sponsors.map(c=>`<div title="${esc(c.titulo)}"><img src="${esc(c.url)}" alt="${esc(c.titulo)}" onerror="this.outerHTML='<span class=&quot;badge b-blue&quot;>${esc(c.titulo)}</span>'"></div>`).join('')}</div>`:''}</div>`}
init();
</script></body></html>
