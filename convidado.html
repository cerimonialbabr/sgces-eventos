<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SGCES — Portal do Convidado</title>
  <style>
:root{
  --bg:#f5f7fb;
  --panel:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --line:#dbe1ea;
  --primary:#173f74;
  --primary-2:#275c9f;
  --soft:#eaf1fb;
  --success:#0f766e;
  --warning:#a16207;
  --danger:#b42318;
  --shadow:0 8px 24px rgba(15,23,42,.08);
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--primary-2);text-decoration:none}
img{max-width:100%;display:block}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.nowrap{white-space:nowrap}
.text-right{text-align:right}

/* shell organização */
.app-shell{min-height:100vh;display:grid;grid-template-columns:260px 1fr}
.sidebar{background:#102d52;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:6px 10px 22px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:16px}
.brand h1{font-size:2.05rem;line-height:1.05;margin:0 0 7px;font-weight:800;letter-spacing:.02em}
.brand p{margin:0;color:#cdd9e8;font-size:.82rem;line-height:1.35}
.nav{display:grid;gap:5px}
.nav button{width:100%;border:0;border-radius:10px;background:transparent;color:#d9e6f4;text-align:left;padding:11px 12px;font-weight:600}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.12);color:#fff}
.sidebar-footer{font-size:.75rem;color:#9fb5cf;margin:28px 10px 0}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.topbar-left,.topbar-right{display:flex;align-items:center;gap:10px;min-width:0}
.active-event-label{font-size:.85rem;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;white-space:nowrap}.active-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#16a34a;margin-right:6px;vertical-align:1px}
.content{padding:26px;max-width:1500px;margin:0 auto}
.page-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.page-heading h2{font-size:2.3rem;line-height:1.15;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
.page-heading p{margin:0;color:var(--muted)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{margin:0 0 12px;font-size:1.12rem}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stats{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 4px 14px rgba(15,23,42,.05)}
.stat strong{display:block;font-size:1.6rem;margin-top:3px}
.stat span{font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}

.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:normal;text-align:center;line-height:1.15;min-height:38px}
.btn:hover{filter:brightness(.98)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-soft{background:var(--soft);border-color:#cbdaf0;color:var(--primary)}
.btn-danger{background:#fff3f2;border-color:#f0c5c1;color:var(--danger)}
.btn-success{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
.btn-sm{padding:6px 9px;font-size:.84rem;border-radius:8px}
.btn-lg{padding:12px 16px;font-size:1rem}
.icon-btn{width:38px;height:38px;padding:0;border-radius:10px}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:.8rem;font-weight:800;color:#445064;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea,.search-input{width:100%;border:1px solid #cfd7e3;border-radius:10px;padding:10px 11px;background:#fff;color:var(--text);outline:none}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.search-input:focus{border-color:#759aca;box-shadow:0 0 0 3px rgba(39,92,159,.11)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.section-actions{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}

.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:10px 11px;border-bottom:1px solid #e8edf4;text-align:left;vertical-align:middle}
th{background:#f8fafc;color:#4b5563;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:0}
tr:hover td{background:#fbfdff}
.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:.75rem;font-weight:800;background:#edf2f7;color:#475569}
.badge.success{background:#dcfce7;color:#166534}
.badge.warning{background:#fef3c7;color:#92400e}
.badge.danger{background:#fee2e2;color:#991b1b}
.badge.info{background:#dbeafe;color:#1d4ed8}

.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:#fff;width:min(840px,96vw);max-height:92vh;overflow:auto;border-radius:18px;box-shadow:0 25px 60px rgba(15,23,42,.25)}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:1.35rem}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:500;display:grid;gap:9px;max-width:380px}
.toast{background:#111827;color:#fff;padding:12px 14px;border-radius:12px;box-shadow:var(--shadow);font-weight:650}
.toast.error{background:#8d1f18}
.toast.success{background:#065f46}
.loading{opacity:.55;pointer-events:none}
.spinner{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* croqui */
.floor-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.floor-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;overflow:auto}
.floor{position:relative;min-width:760px;aspect-ratio:16/9;background-color:#f8fafc;background-image:linear-gradient(90deg,#eef2f7 1px,transparent 1px),linear-gradient(#eef2f7 1px,transparent 1px);background-size:25px 25px;border:1px dashed #cbd5e1;border-radius:12px;overflow:hidden}
.floor-table{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;text-align:center;background:#eef4fb;border:2px solid #7d9fc8;color:#183b68;font-weight:800;user-select:none;touch-action:none;box-shadow:0 5px 14px rgba(15,23,42,.08);cursor:grab}
.floor-table.round{border-radius:50%}
.floor-table.rect{border-radius:9px}
.floor-table.u{border-radius:10px;border-top-color:transparent;background:transparent;box-shadow:none}
.floor-table.dragging{cursor:grabbing;z-index:10;box-shadow:0 12px 28px rgba(15,23,42,.18)}
.floor-table .occ{display:block;font-size:.72rem;font-weight:700;margin-top:2px;color:#52708f}
.floor-table.highlight{outline:6px solid rgba(22,163,74,.28);background:#dcfce7!important;border-color:#16a34a!important;color:#14532d!important;z-index:6}
.floor-table.full{background:#fff1f2;border-color:#e11d48;color:#881337}

/* composição da mesa */
.seating-stage{position:relative;min-height:520px;background:#fbfdff;border:1px solid var(--line);border-radius:16px;overflow:auto}
.seating-canvas{position:relative;width:900px;height:500px;margin:0 auto}
.table-shape{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#f1f5f9;border:3px solid #64748b}
.table-shape.round{width:230px;height:230px;border-radius:50%}
.table-shape.rect{width:470px;height:150px;border-radius:8px}
.table-shape.u{width:410px;height:250px;border:20px solid #64748b;border-top:0;background:transparent;border-radius:0 0 12px 12px}
.seat{position:absolute;transform:translate(-50%,-50%);width:46px;height:132px;border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:0;text-align:center;font-size:.74rem;box-shadow:0 3px 9px rgba(15,23,42,.06);display:flex;align-items:center;justify-content:center;overflow:visible}
.seat .seat-vertical{white-space:nowrap;transform:rotate(-90deg);transform-origin:center;font-weight:800;font-size:.74rem;line-height:1}

/* recepção */
.public-shell{min-height:100vh;background:var(--bg)}
.public-header{background:#102d52;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.public-header h1{font-size:1.85rem;margin:0;line-height:1.05}
.public-header p{margin:4px 0 0;color:#cdd9e8;font-size:.83rem}
.public-main{max-width:1180px;margin:0 auto;padding:22px}
.reception-search{font-size:1.05rem;padding:13px 14px}
.person-card{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px}
.avatar{width:84px;height:84px;border-radius:12px;background:#e9eef5;object-fit:cover;display:flex;align-items:center;justify-content:center;color:#7c899b;font-weight:800;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.person-card h3{margin:0 0 4px;font-size:1.05rem}
.person-card p{margin:2px 0;color:var(--muted);font-size:.88rem}
.nominata-list{display:grid;gap:8px}
.nominata-item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}

/* convidado */
.guest-page{min-height:100vh;background:#f7f8fb}
.guest-hero{background:#102d52;color:#fff;min-height:210px;display:flex;align-items:flex-end;background-size:cover;background-position:center;position:relative}
.guest-hero:before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(3,18,38,.85),rgba(3,18,38,.15))}
.guest-hero-inner{position:relative;z-index:1;max-width:980px;width:100%;margin:0 auto;padding:30px 22px}
.guest-hero h1{font-size:2.15rem;margin:0 0 8px;line-height:1.05}
.guest-main{max-width:980px;margin:0 auto;padding:22px}
.guest-table-callout{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center;box-shadow:var(--shadow)}
.guest-table-callout .number{font-size:3rem;font-weight:900;color:var(--primary);line-height:1}
.content-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.content-link{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;font-weight:750}
.sponsor-row{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;padding:14px}
.sponsor-row a,.sponsor-row span{display:block}
.sponsor-row img{max-width:130px;max-height:70px;object-fit:contain}

/* TV */
.tv-page{min-height:100vh;background:#eef2f7;padding:18px;display:grid;grid-template-rows:auto 1fr auto;gap:14px}
.tv-header{background:#102d52;color:#fff;border-radius:18px;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:18px}
.tv-header h1{font-size:2.15rem;margin:0;line-height:1.05}
.tv-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:14px;min-height:0}
.tv-panel{background:#fff;border-radius:18px;border:1px solid var(--line);padding:16px;overflow:hidden}
.tv-floor{position:relative;width:100%;height:100%;min-height:520px;background:#fbfdff;border-radius:12px;border:1px solid #e2e8f0}
.tv-arrivals{display:grid;gap:8px}
.tv-arrival{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #edf0f4;padding:8px 0;font-size:1.02rem}
.tv-sponsors{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;min-height:86px;display:flex;justify-content:center;align-items:center}

@media (max-width:1100px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .grid-4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  .app-shell{grid-template-columns:1fr}
  .sidebar{position:relative;height:auto;padding:14px}
  .nav{grid-template-columns:repeat(4,minmax(0,1fr));overflow:auto}
  .nav button{text-align:center;font-size:.8rem;padding:9px 7px}
  .brand{padding:3px 5px 14px}.brand h1{font-size:1.65rem}
  .topbar{position:relative;padding:10px 14px;align-items:flex-start;flex-direction:column}
  .content{padding:16px}
  .page-heading h2{font-size:1.9rem}
  .grid-2,.grid-3,.grid-4,.form-grid,.form-grid-3{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .person-card{grid-template-columns:62px 1fr}.person-card .actions{grid-column:1/-1}
  .avatar{width:62px;height:62px}
  .tv-grid{grid-template-columns:1fr}.tv-page{display:block}.tv-panel{margin-bottom:12px}
  .content-links{grid-template-columns:1fr}
}
@media (max-width:520px){
  .stats{grid-template-columns:1fr 1fr}.stat strong{font-size:1.35rem}
  .public-header{padding:14px}.public-header h1{font-size:1.55rem}.public-main{padding:14px}
  .guest-hero h1{font-size:1.8rem}.guest-main{padding:14px}
}

  
.guest-main{max-width:760px;margin:0 auto;padding:16px}
.guest-search-card{padding:20px}.guest-search{font-size:1.08rem;padding:14px}
.guest-result{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:13px;padding:14px;color:var(--text)}
.guest-result:hover{background:#f8fbff;border-color:#9bb2cf}.guest-result strong{font-size:1rem}.guest-result .small{display:block;margin-top:3px}
.group-check{display:grid;gap:8px}.group-check label{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.group-check input{width:20px;height:20px}.group-check label.already{background:#ecfdf5;border-color:#a7f3d0}
.reserve-tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.reserve-table{display:flex;justify-content:space-between;gap:8px;text-align:left;padding:12px;border:1px solid var(--line);background:#fff;border-radius:12px}.reserve-table.selected{border-color:#173f74;background:#eef4fb}.reserve-table.locked{opacity:.48;pointer-events:none}
.portal-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.table-number{font-size:2.5rem;font-weight:900;color:var(--primary);line-height:1}
@media(max-width:820px){.guest-main{padding:12px}.floor{min-width:620px}.reserve-tables{grid-template-columns:1fr}.guest-hero{min-height:150px}.guest-hero h1{font-size:1.8rem}}
@media(max-width:520px){.guest-main{padding:10px}.guest-search-card{padding:14px}.guest-hero{min-height:130px}.guest-hero-inner{padding:18px 14px}.guest-hero h1{font-size:1.55rem}.page-heading h2{font-size:1.55rem!important}.table-number{font-size:2rem}.card{border-radius:13px}}

</style>
</head>
<body>
<div id="guestApp">
  <header class="guest-hero" id="hero">
    <div class="guest-hero-inner"><h1 id="heroTitle">SGCES</h1><p id="heroSub">Portal do convidado</p></div>
  </header>
  <main class="guest-main">
    <section id="lookupView" class="card guest-search-card">
      <div class="page-heading"><div><h2 style="font-size:1.75rem">Localizar minha mesa</h2><p>Digite seu nome. Você também poderá ver e confirmar as pessoas do seu grupo.</p></div></div>
      <input id="guestName" class="search-input guest-search" autocomplete="off" placeholder="Digite seu nome...">
      <div id="guestResults" class="grid" style="margin-top:14px"></div>
    </section>
    <section id="groupView" class="hidden"></section>
    <section id="reserveView" class="hidden"></section>
  </main>
</div>
<script src="config.js"></script>

<script>
(function(){
  let seq = 0;
  const pending = new Map();

  function readyApi(){
    const u = String(window.SGCES_CONFIG && window.SGCES_CONFIG.API_URL || '');
    return /^https:\/\/script\.google\.com\//.test(u) || /^https:\/\/script\.googleusercontent\.com\//.test(u);
  }

  function call(action, payload, timeoutMs){
    payload = payload || {};
    timeoutMs = timeoutMs || 25000;
    if(!readyApi()) return Promise.reject(new Error('Configure a URL do Web App em config.js.'));

    return new Promise((resolve,reject)=>{
      const id = 'sgces_cb_' + Date.now() + '_' + (++seq);
      const script = document.createElement('script');
      const timer = setTimeout(()=>finish(new Error('Tempo esgotado ao consultar a API.')), timeoutMs);

      function finish(err, data){
        clearTimeout(timer);
        try{ delete window[id]; }catch(e){ window[id]=undefined; }
        if(script.parentNode) script.parentNode.removeChild(script);
        pending.delete(id);
        if(err) reject(err); else resolve(data);
      }

      window[id] = function(response){
        if(!response || response.ok !== true) return finish(new Error(response && response.error ? response.error : 'Falha na API.'));
        finish(null, response.data);
      };

      const qs = new URLSearchParams();
      qs.set('action', action);
      qs.set('payload', JSON.stringify(payload));
      qs.set('callback', id);
      qs.set('_', Date.now());
      script.src = window.SGCES_CONFIG.API_URL + (window.SGCES_CONFIG.API_URL.includes('?') ? '&' : '?') + qs.toString();
      script.onerror = ()=>finish(new Error('Não foi possível carregar a API do SGCES.'));
      document.head.appendChild(script);
      pending.set(id, {script,timer});
    });
  }

  window.SGCES_API = { call, readyApi };
})();

</script>
<script>
(function(){
  const $ = (sel,root=document)=>root.querySelector(sel);
  const $$ = (sel,root=document)=>Array.from(root.querySelectorAll(sel));
  const esc = s=>String(s==null?'':s).replace(/[&<>'"]/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[c]));
  const yes = v=>['SIM','S','YES','TRUE','1'].includes(String(v||'').toUpperCase()) || v===true || v===1;
  const num = (v,d=0)=>{ const n=Number(v); return Number.isFinite(n)?n:d; };
  const fmtDate = v=>{
    if(!v) return '';
    const s=String(v).trim();
    let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m) return `${m[3]}/${m[2]}/${m[1]}`;
    m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(m) return `${String(m[1]).padStart(2,'0')}/${String(m[2]).padStart(2,'0')}/${m[3]}`;
    const d=new Date(v);
    if(Number.isNaN(d.getTime())) return s;
    return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  };
  const fmtTime = v=>{
    if(!v) return '';
    const s=String(v).trim();
    const m=s.match(/(?:^|T)(\d{1,2}):(\d{2})/);
    if(m) return `${String(m[1]).padStart(2,'0')}:${m[2]}`;
    const d=new Date(v);
    if(Number.isNaN(d.getTime())) return s.slice(0,5);
    return new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
  };
  const normalize = s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const byPrecedence = (a,b)=>{
    const pa=num(a.ORDEM_PRECEDENCIA,999999)||999999;
    const pb=num(b.ORDEM_PRECEDENCIA,999999)||999999;
    return pa-pb || String(a.NOME_COMPLETO||'').localeCompare(String(b.NOME_COMPLETO||''),'pt-BR');
  };
  const displayName = g=>[g.POSTO_GRAD,g.NOME_GUERRA||g.NOME_COMPLETO].filter(Boolean).join(' ').trim();
  const tableName = t=>t ? (t.NOME || ('Mesa '+t.NUMERO)) : 'Sem mesa';

  function driveImage(url){
    url=String(url||'').trim();
    if(!url) return '';
    const m=url.match(/\/d\/([A-Za-z0-9_-]+)/) || url.match(/[?&]id=([A-Za-z0-9_-]+)/);
    if(m && /drive\.google\.com/.test(url)) return 'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1200';
    return url;
  }

  function toast(msg,type){
    let wrap=$('.toast-wrap');
    if(!wrap){ wrap=document.createElement('div'); wrap.className='toast-wrap'; document.body.appendChild(wrap); }
    const el=document.createElement('div'); el.className='toast '+(type||''); el.textContent=msg; wrap.appendChild(el);
    setTimeout(()=>el.remove(),3600);
  }

  function setBusy(el,busy,label){
    if(!el) return;
    if(busy){
      if(!el.dataset.original) el.dataset.original=el.innerHTML;
      el.disabled=true; el.innerHTML='<span class="spinner"></span> '+(label||'Aguarde');
    }else{
      el.disabled=false; if(el.dataset.original){el.innerHTML=el.dataset.original; delete el.dataset.original;}
    }
  }

  function modal(title, bodyHtml, footerHtml){
    const bd=document.createElement('div'); bd.className='modal-backdrop';
    bd.innerHTML=`<div class="modal"><div class="modal-head"><h3>${esc(title)}</h3><button class="btn icon-btn" data-close>&times;</button></div><div class="modal-body">${bodyHtml}</div><div class="modal-foot">${footerHtml||'<button class="btn" data-close>Fechar</button>'}</div></div>`;
    bd.addEventListener('click',e=>{ if(e.target===bd || e.target.closest('[data-close]')) bd.remove(); });
    document.body.appendChild(bd); return bd;
  }

  function badgeStatus(v){
    const s=String(v||'').toUpperCase();
    let cls='';
    if(['PRESENTE','CONFIRMADO','SIM','ATIVO'].includes(s)) cls='success';
    else if(['PENDENTE','RASCUNHO'].includes(s)) cls='warning';
    else if(['NÃO COMPARECERÁ','NAO COMPARECERA','ARQUIVADO','NAO'].includes(s)) cls='danger';
    return `<span class="badge ${cls}">${esc(v||'—')}</span>`;
  }

  function renderFloor(container,tables,opts){
    opts=opts||{}; container.innerHTML=''; container.classList.add(opts.tv?'tv-floor':'floor');
    const bg=String(opts.backgroundUrl||'').trim();
    if(bg){container.style.backgroundImage=`url("${driveImage(bg).replace(/"/g,'%22')}")`;container.style.backgroundSize='contain';container.style.backgroundPosition='center';container.style.backgroundRepeat='no-repeat';}
    else{container.style.backgroundImage='';container.style.backgroundSize='';container.style.backgroundPosition='';container.style.backgroundRepeat='';}
    const highlighted=String(opts.highlightTableId||'');const ratio=(container.clientWidth&&container.clientHeight)?container.clientWidth/container.clientHeight:(16/9);
    (tables||[]).forEach(t=>{const el=document.createElement('div'),shape=String(t.FORMATO||'REDONDA').toUpperCase();el.className='floor-table '+(shape==='RETANGULAR'?'rect':shape==='U'?'u':'round');if(String(t.ID_MESA)===highlighted)el.classList.add('highlight');if(num(t.VAGAS,1)<=0&&num(t.CAPACIDADE)>0)el.classList.add('full');const w=num(t.W,shape==='RETANGULAR'?18:10),h=shape==='REDONDA'?w*ratio:num(t.H,shape==='RETANGULAR'?8:10);el.style.left=num(t.X,50)+'%';el.style.top=num(t.Y,50)+'%';el.style.width=w+'%';el.style.height=h+'%';el.style.transform=`translate(-50%,-50%) rotate(${num(t.ROTACAO,0)}deg)`;const occ=typeof t.OCUPACAO!=='undefined'?`<span class="occ">${num(t.OCUPACAO)}/${num(t.CAPACIDADE)}${typeof t.VAGAS!=='undefined'?' • '+num(t.VAGAS)+' vaga(s)':''}</span>`:'';el.innerHTML=`<div>${esc(t.NOME||('Mesa '+t.NUMERO))}${occ}</div>`;container.appendChild(el);});
  }

  function seatCoordinates(table, seatCode, total){
    const format=String(table.FORMATO||'REDONDA').toUpperCase();
    total=Math.max(num(table.CAPACIDADE,8),total||0);
    if(format==='REDONDA'){
      const i=num(String(seatCode).replace('R',''),0), angle=(-90)+(360*i/total), rad=190;
      return {x:450+Math.cos(angle*Math.PI/180)*rad,y:250+Math.sin(angle*Math.PI/180)*rad};
    }
    if(format==='U'){
      const pos=num(String(seatCode).replace('U',''),1);
      // Posições 1.. alternam a partir do centro da base e depois sobem pelas laterais.
      const baseCount=Math.min(5,total), sideRest=Math.max(0,total-baseCount), leftCount=Math.ceil(sideRest/2), rightCount=Math.floor(sideRest/2);
      if(pos<=baseCount){
        const order=[0,1,-1,2,-2]; const offset=order[pos-1]||0; return {x:450+offset*82,y:405};
      }
      const k=pos-baseCount;
      if(k%2===1){ const idx=Math.ceil(k/2); return {x:235,y:355-(idx-1)*82}; }
      const idx=k/2; return {x:665,y:355-(idx-1)*82};
    }
    const heads=yes(table.CABECEIRAS);
    let side=total-(heads?2:0), top=Math.ceil(side/2), bottom=Math.floor(side/2);
    const code=String(seatCode||'');
    if(code==='L') return {x:160,y:250};
    if(code==='R') return {x:740,y:250};
    if(code.startsWith('T')){ const i=num(code.slice(1)); return {x:260+(top<=1?0:i*(380/(top-1))),y:135}; }
    if(code.startsWith('B')){ const i=num(code.slice(1)); return {x:260+(bottom<=1?0:i*(380/(bottom-1))),y:365}; }
    return {x:450,y:90};
  }

  function renderSeating(container,table,guests){
    container.innerHTML='<div class="seating-canvas"></div>';
    const canvas=container.firstElementChild;
    const format=String(table.FORMATO||'REDONDA').toUpperCase();
    const shape=document.createElement('div'); shape.className='table-shape '+(format==='RETANGULAR'?'rect':format==='U'?'u':'round'); canvas.appendChild(shape);
    (guests||[]).filter(g=>g.ASSENTO).forEach(g=>{
      const p=seatCoordinates(table,g.ASSENTO,Math.max(2,(guests||[]).length));
      const s=document.createElement('div'); s.className='seat'; s.style.left=p.x+'px'; s.style.top=p.y+'px';
      const nome=[g.POSTO_GRAD,g.NOME_GUERRA||g.NOME_COMPLETO].filter(Boolean).join(' ');
      const cardH=Math.max(122,Math.min(190,56+nome.length*5.2));
      s.style.height=cardH+'px';
      s.innerHTML=`<div class="seat-vertical" style="width:${Math.max(108,cardH-14)}px;font-size:${nome.length>25?'.68rem':nome.length>20?'.71rem':'.74rem'}">${esc(nome)}</div>`;
      canvas.appendChild(s);
    });
  }

  window.SGCES_UI={$, $$, esc, yes, num, fmtDate, fmtTime, normalize, byPrecedence, displayName, tableName, driveImage, toast, setBusy, modal, badgeStatus, renderFloor, renderSeating, seatCoordinates};
})();

</script>
<script>
(function(){
  const U=SGCES_UI,A=SGCES_API;let publicData=null,groupData=null,selectedGuestId='',selectedReserveTable='';const q=new URLSearchParams(location.search);const eventId=(q.get('evento')||'').trim();const mode=(q.get('modo')||'').trim().toLowerCase();
  document.addEventListener('DOMContentLoaded',async()=>{
    U.$('#guestName').addEventListener('input',debounce(searchName,280));
    await loadPublic();
    if(mode==='reserva')renderReserve();else{showLookup();setTimeout(()=>U.$('#guestName').focus(),80);}
  });
  function key(v){return U.normalize(v).toUpperCase();}
  function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
  async function loadPublic(){try{publicData=await A.call('publicConfig',{eventId});applyEventBrand(publicData.event);}catch(e){U.toast(e.message,'error');}}
  function applyEventBrand(e){e=e||{};if(e.NOME){U.$('#heroTitle').textContent=e.NOME;U.$('#heroSub').textContent=e.SUBTITULO||[U.fmtDate(e.DATA),U.fmtTime(e.HORARIO),e.LOCAL].filter(Boolean).join(' • ');}if(e.BANNER_URL)U.$('#hero').style.backgroundImage=`url("${U.driveImage(e.BANNER_URL).replace(/"/g,'%22')}")`;}
  function showLookup(){U.$('#lookupView').classList.remove('hidden');U.$('#groupView').classList.add('hidden');U.$('#reserveView').classList.add('hidden');}
  async function searchName(){const raw=U.$('#guestName').value.trim();const box=U.$('#guestResults');if(raw.length<2){box.innerHTML='<p class="muted">Digite pelo menos 2 letras.</p>';return;}box.innerHTML='<p class="muted">Buscando...</p>';try{const r=await A.call('guestSearch',{eventId,query:raw});applyEventBrand(r.event);box.innerHTML=r.results.length?r.results.map(x=>`<button class="guest-result" data-id="${U.esc(x.ID_CONVIDADO)}"><span><strong>${U.esc([x.POSTO_GRAD,x.NOME_GUERRA||x.NOME_COMPLETO].filter(Boolean).join(' '))}</strong><span class="small muted">${U.esc(x.NOME_COMPLETO||'')}${x.TITULAR_NOME?' • Grupo de '+U.esc(x.TITULAR_NOME):''}</span></span><span>›</span></button>`).join(''):'<p class="muted">Nenhum nome encontrado.</p>';U.$$('#guestResults [data-id]').forEach(b=>b.onclick=()=>openGroup(b.dataset.id));}catch(e){box.innerHTML='';U.toast(e.message,'error');}}
  async function openGroup(id){selectedGuestId=id;try{groupData=await A.call('guestGroup',{eventId,guestId:id});applyEventBrand(groupData.event);renderGroup();}catch(e){U.toast(e.message,'error');}}
  function renderGroup(){if(!groupData)return;U.$('#lookupView').classList.add('hidden');U.$('#reserveView').classList.add('hidden');const v=U.$('#groupView');v.classList.remove('hidden');const t=groupData.table,group=groupData.group||[],content=groupData.contents||[],sponsors=groupData.sponsors||[];const pending=group.filter(x=>String(x.CHECKIN).toUpperCase()!=='PRESENTE');v.innerHTML=`<button class="btn btn-sm" data-back style="margin-bottom:12px">← Nova busca</button><div class="guest-table-callout"><div class="muted small">SUA MESA</div>${t?`<div class="table-number">${U.esc(t.NUMERO||t.NOME)}</div><div style="font-weight:800;margin-top:5px">${U.esc(t.NOME)}</div>`:'<div style="font-size:1.4rem;font-weight:800">Mesa ainda não definida</div>'}</div><div class="card" style="margin-top:16px"><h3>Quem chegou com você?</h3><p class="muted">Deixe marcado quem está entrando agora. Quem já teve a chegada confirmada aparece em verde.</p><div class="group-check">${group.map(x=>{const present=String(x.CHECKIN).toUpperCase()==='PRESENTE';return `<label class="${present?'already':''}"><input type="checkbox" value="${U.esc(x.ID_CONVIDADO)}" ${present?'checked disabled':'checked'}><span><strong>${U.esc([x.POSTO_GRAD,x.NOME_GUERRA||x.NOME_COMPLETO].filter(Boolean).join(' '))}</strong><span class="small muted" style="display:block">${U.esc(x.TIPO||'CONVIDADO')}${present?' • presença já confirmada':''}</span></span></label>`;}).join('')}</div><div class="portal-actions" style="margin-top:14px">${pending.length?'<button class="btn btn-success" data-confirm>Confirmar chegada dos selecionados</button>':'<span class="badge success">Todo o grupo já teve a chegada confirmada</span>'}${!t&&canChooseTable()?'<button class="btn btn-soft" data-table>Informar a mesa do grupo</button>':''}</div></div>${t?`<div class="card" style="margin-top:16px"><h3>Localização da mesa</h3><p class="muted">Sua mesa está destacada no croqui.</p><div class="floor-wrap"><div id="guestFloor" class="floor"></div></div></div>`:''}${content.length?`<div class="card" style="margin-top:16px"><h3>Informações do evento</h3><div class="content-links">${content.map(x=>`<a class="content-link" href="${U.esc(x.URL)}" target="_blank"><span>▣</span><span>${U.esc(x.TITULO)}<div class="small muted">${U.esc(x.TIPO)}</div></span></a>`).join('')}</div></div>`:''}${sponsors.length?`<div class="card" style="margin-top:16px"><h3 style="text-align:center">Patrocinadores e apoiadores</h3><div class="sponsor-row">${sponsors.map(s=>`${s.URL_SITE?`<a href="${U.esc(s.URL_SITE)}" target="_blank">`:'<span>'}<img src="${U.esc(U.driveImage(s.LOGO_URL))}" alt="${U.esc(s.NOME)}">${s.URL_SITE?'</a>':'</span>'}`).join('')}</div></div>`:''}`;U.$('[data-back]',v).onclick=()=>{groupData=null;selectedGuestId='';U.$('#guestName').value='';U.$('#guestResults').innerHTML='';showLookup();};const confirm=U.$('[data-confirm]',v);if(confirm)confirm.onclick=confirmGroup;const tb=U.$('[data-table]',v);if(tb)tb.onclick=chooseGroupTable;if(t)U.renderFloor(U.$('#guestFloor'),groupData.tables||[],{highlightTableId:t.ID_MESA,backgroundUrl:groupData.event&&groupData.event.CROQUI_URL});}
  async function confirmGroup(){const checks=U.$$('#groupView .group-check input:not(:disabled):checked');if(!checks.length){U.toast('Selecione quem está chegando.','error');return;}const b=U.$('#groupView [data-confirm]');U.setBusy(b,true,'Confirmando');try{const r=await A.call('groupCheckIn',{eventId,guestId:selectedGuestId,guestIds:checks.map(x=>x.value)});groupData=r.data;renderGroup();U.toast('Chegada registrada.','success');}catch(e){U.toast(e.message,'error');}finally{U.setBusy(b,false);}}
  function canChooseTable(){const e=groupData&&groupData.event||{};return ['LIVRE','HIBRIDO','RESERVA'].includes(key(e.MODO_PADRAO));}
  function eligibleTables(){return (groupData&&groupData.tables||[]).filter(t=>!U.yes(t.MESA_AUTORIDADES)&&['LIVRE','HIBRIDO','RESERVA'].includes(key(t.TIPO_ALOCACAO))&&U.num(t.VAGAS)>=(groupData.group||[]).length);}
  function chooseGroupTable(){const list=eligibleTables();const m=U.modal('Informar mesa do grupo',list.length?`<div class="grid">${list.map(t=>`<button class="btn" style="justify-content:space-between" data-t="${U.esc(t.ID_MESA)}"><span><strong>${U.esc(t.NOME)}</strong><span class="small muted" style="display:block">${U.esc(t.TIPO_ALOCACAO)}</span></span><span>${U.num(t.VAGAS)} vaga(s)</span></button>`).join('')}</div>`:'<p>Não há mesa com vagas suficientes para todo o grupo.</p>');m.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{groupData=await A.call('setGroupTable',{eventId,guestId:selectedGuestId,tableId:b.dataset.t});m.remove();renderGroup();U.toast('Mesa do grupo registrada.','success');}catch(e){U.toast(e.message,'error');b.disabled=false;}});}
  function renderReserve(){U.$('#lookupView').classList.add('hidden');U.$('#groupView').classList.add('hidden');const v=U.$('#reserveView');v.classList.remove('hidden');const e=publicData&&publicData.event||{};applyEventBrand(e);const eventMode=key(e.MODO_PADRAO);if(!['RESERVA','HIBRIDO','LIVRE'].includes(eventMode)){v.innerHTML='<div class="card"><h2>Reserva indisponível</h2><p class="muted">Este evento não está configurado para reserva remota.</p></div>';return;}const tables=(publicData.tables||[]).filter(t=>t.RESERVAVEL&&U.num(t.VAGAS)>0);v.innerHTML=`<div class="card"><div class="page-heading"><div><h2 style="font-size:1.75rem">Reserva de mesas</h2><p>Cadastre o titular, informe os convidados e escolha uma mesa disponível. Mesas de autoridades não aparecem para reserva.</p></div></div><div class="form-grid"><div class="field"><label>Posto / Graduação</label><input id="rPosto"></div><div class="field"><label>Nome completo do titular</label><input id="rNome"></div><div class="field"><label>Nome de guerra</label><input id="rGuerra"></div><div class="field"><label>OM / Órgão</label><input id="rOm"></div><div class="field"><label>E-mail</label><input id="rEmail" type="email"></div><div class="field"><label>Telefone</label><input id="rTel"></div><div class="field" style="grid-column:1/-1"><label>Demais pessoas do grupo — uma por linha</label><textarea id="rGuests" placeholder="Maria Silva\nPedro Silva"></textarea></div></div><h3 style="margin-top:18px">Escolha a mesa</h3><p class="small muted">Cada nome ocupa uma vaga. Se o evento for de ocupação livre, você pode deixar a mesa para definir depois.</p><div class="reserve-tables" id="reserveTables">${eventMode==='LIVRE'?'<button class="reserve-table selected" data-t=""><span><strong>Definir depois</strong><span class="small muted" style="display:block">O grupo informará a mesa no evento.</span></span></button>':''}${tables.map(t=>`<button class="reserve-table" data-t="${U.esc(t.ID_MESA)}"><span><strong>${U.esc(t.NOME)}</strong><span class="small muted" style="display:block">${U.esc(t.TIPO_ALOCACAO)}</span></span><span>${U.num(t.VAGAS)} vaga(s)</span></button>`).join('')}</div><div class="portal-actions" style="margin-top:18px"><button class="btn btn-primary btn-lg" data-reserve>Confirmar reserva</button></div></div>`;selectedReserveTable=eventMode==='LIVRE'?'':(tables[0]?tables[0].ID_MESA:'');U.$$('#reserveTables [data-t]').forEach((b,i)=>{if(selectedReserveTable&&b.dataset.t===selectedReserveTable)b.classList.add('selected');b.onclick=()=>{selectedReserveTable=b.dataset.t;U.$$('#reserveTables [data-t]').forEach(x=>x.classList.toggle('selected',x===b));};});U.$('[data-reserve]',v).onclick=submitReserve;}
  async function submitReserve(){const v=U.$('#reserveView'),e=publicData.event,eventMode=key(e.MODO_PADRAO),names=U.$('#rGuests',v).value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),payload={eventId:e.ID_EVENTO,tableId:selectedReserveTable,titular:{postoGrad:U.$('#rPosto',v).value.trim(),nomeCompleto:U.$('#rNome',v).value.trim(),nomeGuerra:U.$('#rGuerra',v).value.trim(),omOrgao:U.$('#rOm',v).value.trim(),email:U.$('#rEmail',v).value.trim(),telefone:U.$('#rTel',v).value.trim()},convidados:names.map(nomeCompleto=>({nomeCompleto})),primeiroEhAcompanhante:names.length>0};if(!payload.titular.nomeCompleto){U.toast('Informe o nome completo do titular.','error');return;}if(eventMode==='RESERVA'&&!payload.tableId){U.toast('Escolha uma mesa.','error');return;}const b=U.$('[data-reserve]',v);U.setBusy(b,true,'Reservando');try{const r=await A.call('publicRegister',payload,45000);v.innerHTML=`<div class="card" style="text-align:center"><div class="badge success">RESERVA CONCLUÍDA</div><h2 style="margin-top:12px">${U.esc(r.titular.NOME_COMPLETO)}</h2><p>${r.table?`Mesa reservada: <strong>${U.esc(r.table.NOME)}</strong>.`:'A mesa poderá ser informada no evento.'}</p><p class="muted">No dia do evento, qualquer pessoa do grupo poderá usar o portal “Localizar minha mesa” e pesquisar pelo próprio nome.</p></div>`;}catch(err){U.toast(err.message,'error');}finally{U.setBusy(b,false);}}
})();

</script>
