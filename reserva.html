<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reserva de Mesa</title><link rel="stylesheet" href="assets/style.css"><script src="config.js"></script><script src="assets/api.js"></script></head><body>
<header><h1 id="title">Reserva de Mesa</h1></header><main><div id="app"></div></main><script>document.body.insertAdjacentHTML('beforeend',foot())</script>
<script>
const eventId=qs('evento');let E=null,T=[],titular=null,companions=[];async function init(){try{E=await apiGet('publicEvent',{evento:eventId});T=await apiGet('publicTables',{evento:eventId});title.textContent=E.nome;findTitular()}catch(e){app.innerHTML=`<div class=panel><h2>Evento indisponível</h2><p>${esc(e.message)}</p></div>`}}
function findTitular(){app.innerHTML=`${E.banner?`<img class=banner src="${esc(E.banner)}">`:''}<div class="panel search-box"><h2>Reserva / escolha de mesa</h2><p>Localize primeiro o titular da reserva.</p><input id=q placeholder="Digite seu nome..." oninput=searchSoon()><div id=results></div></div>`}
let tm;function searchSoon(){clearTimeout(tm);tm=setTimeout(search,250)}async function search(){const v=q.value.trim();if(v.length<2){results.innerHTML='';return}try{const a=await apiGet('publicSearchGuests',{evento:eventId,q:v});results.innerHTML=a.map(r=>`<div class=result-card onclick='selectTitular(${JSON.stringify(JSON.stringify(r))})'><div class=result-main><b>${esc(r.posto)} ${esc(r.nome)}</b><span>${esc(r.organizacao)}</span></div><span>›</span></div>`).join('')||'<p class=muted>Nenhum nome localizado.</p>'}catch(e){toast(e.message,true)}}
function selectTitular(raw){titular=JSON.parse(raw);companions=[];groupForm()}
function groupForm(){app.innerHTML=`<div class=panel><h2>Titular</h2><p><b>${esc(titular.posto)} ${esc(titular.nome)}</b><br>${esc(titular.organizacao)}</p></div><div class=panel><div class=actions><h2 style="flex:1">Convidados do titular</h2><button onclick=addCompanion()>+ Adicionar convidado</button></div><div id=compList></div><p class=muted>Adicione apenas as pessoas que ocuparão lugares junto ao titular.</p><button onclick=chooseTable()>Escolher mesa</button> <button class=secondary onclick=findTitular()>Voltar</button></div>`;renderCompanions()}
function addCompanion(){companions.push({nome:'',posto:'',organizacao:''});renderCompanions()}
function removeCompanion(i){companions.splice(i,1);renderCompanions()}
function renderCompanions(){const el=document.getElementById('compList');if(!el)return;el.innerHTML=companions.length?companions.map((c,i)=>`<div class="grid g4" style="margin-bottom:8px"><div><label>Nome completo</label><input value="${esc(c.nome)}" oninput="companions[${i}].nome=this.value"></div><div><label>Posto/graduação (se houver)</label><input value="${esc(c.posto)}" oninput="companions[${i}].posto=this.value"></div><div><label>Organização (se houver)</label><input value="${esc(c.organizacao)}" oninput="companions[${i}].organizacao=this.value"></div><div><label>&nbsp;</label><button class=danger onclick="removeCompanion(${i})">Remover</button></div></div>`).join(''):'<p class=muted>Nenhum convidado adicional.</p>'}
async function chooseTable(){if(companions.some(c=>!c.nome.trim())){toast('Preencha o nome de todos os convidados.',true);return}T=await apiGet('publicTables',{evento:eventId});const need=1+companions.length;const free=T.filter(t=>t.politica!=='FIXO'&&Number(t.vagas)>=need);app.innerHTML=`<div class=panel><h2>Escolha uma mesa</h2><p>Grupo: <b>${need}</b> pessoa(s). São exibidas apenas mesas com vagas suficientes.</p><div id=floor class=floor></div><p><button class=secondary onclick=groupForm()>Voltar</button></p></div>`;renderFloor(floor,free,{background:E.croquiFundo,showVacancies:true,click:t=>reserve(t)})}
async function reserve(t){if(!confirm(`Reservar a Mesa ${t.numero} para ${1+companions.length} pessoa(s)?`))return;try{const r=await apiPost('publicReserveGroup',{evento:eventId,titularId:titular.id,tableId:t.id,companions});app.innerHTML=`<div class="panel guest-hero"><h2>Reserva confirmada</h2><p>${esc(titular.nome)}</p><div class=mesa>MESA ${esc(r.mesa.numero)}</div><p>${esc(r.mesa.nome)}</p><p>${r.totalGrupo} pessoa(s) no grupo.</p><button onclick=findTitular()>Nova reserva</button></div>`}catch(e){toast(e.message,true);T=await apiGet('publicTables',{evento:eventId})}}
init();
</script></body></html>
