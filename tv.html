<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SGCM-Mesas — TV</title><link rel="stylesheet" href="assets/style.css"><script src="config.js"></script><script src="assets/api.js"></script></head><body class=tv><header><h1 id=title>Painel do Evento</h1><span id=clock></span></header><main id=app></main><script>
const token=qs('token'),eventId=qs('evento');let S=null;async function load(){try{S=await apiGet('tvData',{token,evento:eventId});render()}catch(e){app.innerHTML=`<div class=panel><h2>Erro</h2><p>${esc(e.message)}</p></div>`}}function render(){title.textContent=S.event.nome;const showNames=String(S.event.exibirNomesTv)==='SIM';app.innerHTML=`${S.event.banner?`<img class=banner src="${esc(S.event.banner)}">`:''}<div class=kpis><div class=kpi><b>${S.stats.presentes}</b><span>Presentes</span></div><div class=kpi><b>${S.stats.confirmados}</b><span>Confirmados</span></div><div class=kpi><b>${S.stats.total}</b><span>Convidados</span></div><div class=kpi><b>${S.stats.autoridadesPresentes}/${S.stats.autoridades}</b><span>Autoridades presentes</span></div><div class=kpi><b>${S.tables.reduce((a,t)=>a+Number(t.vagas||0),0)}</b><span>Vagas nas mesas</span></div></div><div class="grid g3" style="grid-template-columns:2fr 1fr 1fr;margin-top:14px"><div class=panel style="grid-column:span 2"><h2>Croqui geral</h2><div id=floor class=floor></div></div><div class=panel><h2>Últimas confirmações</h2><div class=tv-latest>${S.latest.map(x=>`<div>${showNames?`<b>${esc(x.posto)} ${esc(x.nome)}</b><br>`:''}<span>${esc(String(x.hora).slice(11,16))}${x.mesaId?' · mesa confirmada':''}</span></div>`).join('')||'<p class=muted>Aguardando chegadas.</p>'}</div></div></div>${sponsors()}`;renderFloor(floor,S.tables,{background:S.event.croquiFundo,showVacancies:true})}function sponsors(){const a=S.event.conteudos.filter(c=>c.tipo==='PATROCINADOR');if(!a.length)return'';return `<div class=panel><div class=sponsor-strip>${a.map(c=>`<img src="${esc(c.url)}" alt="${esc(c.titulo)}" onerror="this.outerHTML='<span class=&quot;badge b-blue&quot;>${esc(c.titulo)}</span>'">`).join('')}</div></div>`}function tick(){clock.textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,1000);load();setInterval(load,10000);
</script></body></html>
